<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exposition géographique</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#ffffff;font-family:Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:#0a0b0d;-webkit-font-smoothing:antialiased}
  body{overflow:hidden}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  #hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:0 0 14px}
  #seg{display:flex;background:#eef0f3;border-radius:100px;padding:3px;gap:2px;flex:none}
  #seg button{border:0;background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:#5b616e;padding:7px 13px;border-radius:100px;cursor:pointer;white-space:nowrap}
  #seg button.on{background:#fff;color:#0a0b0d;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  #stage{position:relative}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .country{stroke:#ffffff;stroke-width:.4;cursor:pointer}
  .arc{stroke:#fff;stroke-width:1.5;cursor:pointer}
  #tip{position:absolute;pointer-events:none;background:#16181c;color:#fff;border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.45;opacity:0;transition:opacity .1s;z-index:9;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18)}
  #tip b{font-size:13px;font-weight:600}
  #tip .v{font-family:'JetBrains Mono',ui-monospace,monospace;color:#7fb0ff}
  #legend{display:flex;align-items:center;gap:8px;margin-top:12px}
  #ramp{display:flex;height:6px;border-radius:3px;overflow:hidden;flex:1}
  #ramp i{flex:1}
  .lgl{font-size:10.5px;color:#7c828a;white-space:nowrap}
  #list{margin-top:14px;padding-top:14px;border-top:1px solid #eef0f3;display:flex;flex-direction:column}
  .row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;cursor:pointer;position:relative}
  .row:hover,.row.sel{background:#f7f7f7}
  .row:after{content:'›';position:absolute;right:6px;color:#c8ccd2;font-size:15px;opacity:0;transition:opacity .1s}
  .row:hover:after{opacity:1}
  .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .nm{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc{font-size:13px;font-weight:600;flex:none}
  .am{font-size:12px;color:#7c828a;width:72px;text-align:right;flex:none}
  #note{font-size:12px;color:#7c828a;line-height:1.5;margin-top:12px}
  #detail{margin-top:14px;background:#16181c;border-radius:16px;padding:18px}
  #dHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  #dName{font-size:16px;font-weight:600;color:#fff;letter-spacing:-.2px}
  #dMeta{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:#7fb0ff;margin-top:3px}
  #dClose{border:0;background:#2a2f37;color:#a8acb3;width:28px;height:28px;border-radius:9999px;font-size:13px;cursor:pointer;flex:none;font-family:inherit;line-height:1}
  #dClose:hover{background:#3a4049;color:#fff}
  #dMix{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:14px}
  #dTypes{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:11px}
  .tg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#a8acb3;white-space:nowrap}
  .tg i{width:9px;height:9px;border-radius:2px;flex:none}
  .tg b{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;font-weight:600;color:#fff}
  #dRows{margin-top:14px;padding-top:12px;border-top:1px solid #2a2f37;display:flex;flex-direction:column;gap:11px}
  .hr{display:flex;align-items:flex-start;gap:10px}
  .hr i{width:8px;height:8px;border-radius:2px;flex:none;margin-top:5px}
  .hrb{flex:1;min-width:0}
  .hrn{font-size:13px;font-weight:500;color:#fff;line-height:1.35}
  .hrt{font-size:11.5px;color:#7c828a;margin-top:2px}
  .hra{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;font-weight:500;color:#fff;flex:none;white-space:nowrap}
  #ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 26%}
  #ctrP{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;font-weight:500;letter-spacing:-.7px}
  #ctrL{font-size:11.5px;color:#5b616e;margin-top:2px;line-height:1.25}
  #ctrA{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;margin-top:5px}
  #offline{padding:28px 12px;text-align:center;color:#7c828a;font-size:13px;line-height:1.6}
  .hide{display:none !important}
</style>
</head>
<body>
<div id="hd">
  <div>
    <div style="font-size:15px;font-weight:600;letter-spacing:-.1px">Exposition géographique</div>
    <div id="sub" style="font-size:12px;color:#7c828a;margin-top:3px">Actions et obligations · ETF décomposés</div>
  </div>
  <div id="seg">
    <button id="bMap" class="on" type="button">Carte</button>
    <button id="bPie" type="button">Cercle</button>
  </div>
</div>

<div id="stage">
  <div id="mapWrap"><svg id="map" viewBox="0 0 640 330" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div id="pieWrap" class="hide" style="position:relative">
    <svg id="pie" viewBox="0 0 240 240" preserveAspectRatio="xMidYMid meet" style="max-width:236px;margin:0 auto"></svg>
    <div id="ctr"><div id="ctrP">100 %</div><div id="ctrL">de l'exposition</div><div id="ctrA"></div></div>
  </div>
  <div id="tip"></div>
</div>

<div id="legend">
  <span class="lgl" style="display:flex;align-items:center;gap:5px"><i style="width:11px;height:6px;border-radius:2px;background:#f2f3f5;border:1px solid #e2e4e8;display:inline-block"></i>aucune</span>
  <span class="lgl">&lt;0,5 %</span>
  <div id="ramp"></div>
  <span class="lgl">70 %+</span>
</div>

<div id="list"></div>

<div id="detail" class="hide">
  <div id="dHead">
    <div>
      <div id="dName"></div>
      <div id="dMeta"></div>
    </div>
    <button id="dClose" type="button" aria-label="Fermer">✕</button>
  </div>
  <div id="dMix"></div>
  <div id="dTypes"></div>
  <div id="dRows"></div>
</div>
<div id="note"></div>

<script>
(function () {
  /* Hauteur réelle → app parente (l'iframe s'auto-dimensionne).
     Envoi immédiat *puis* après rendu : requestAnimationFrame ne se déclenche pas
     quand la page ne compose aucune frame (app en arrière-plan), et la hauteur
     resterait bloquée sur sa valeur par défaut. */
  function post() {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'worldExposureHeight', height: document.body.scrollHeight }, '*');
    }
  }
  function report() {
    post();
    requestAnimationFrame(post);
  }
  window.addEventListener('load', report);
  window.addEventListener('resize', report);
  setTimeout(report, 400);
  setTimeout(report, 1200);

  /* d3 et topojson viennent d'un CDN : hors ligne, on dégrade proprement. */
  if (!window.d3 || !window.topojson) {
    document.getElementById('stage').innerHTML =
      '<div id="offline">Carte indisponible hors ligne.<br>Cette vue a besoin d\'une connexion pour charger le fond de carte.</div>';
    document.getElementById('legend').classList.add('hide');
    document.getElementById('seg').classList.add('hide');
    report();
    return;
  }

  var SCOPE = (new URLSearchParams(location.search).get('scope') || 'Tout');
  if (['Tout', 'PEA', 'AV'].indexOf(SCOPE) === -1) SCOPE = 'Tout';

  /* Répartition géographique par transparence sur les ETF.
     Statique, comme les vues Secteurs et Doublons : un export courtier ne
     donne pas la composition pays des fonds. */
  var SETS = {
    Tout: {
      total: 1602.84, other: 25.13,
      sub: 'Actions et obligations · ETF décomposés',
      note: "Le Livret A (6 681,68 €) est exclu : c'est de l'épargne réglementée française non investie. Sur la part investie, la France pèse 71,8 % — presque tout ton risque est sur un seul pays.",
      rows: [
        ['250','FR','France',1151.59,'Schneider, Sidetrade, Engie + oblig. euro'],
        ['840','US','États-Unis',246.53,'Amundi S&P 500 ×2 + MSCI World'],
        ['276','DE','Allemagne',37.61,'Oblig. euro + Vanguard Europe'],
        ['380','IT','Italie',32.91,'Oblig. euro + Vanguard Europe'],
        ['724','ES','Espagne',21.62,'Oblig. euro + Vanguard Europe'],
        ['392','JP','Japon',18.47,'Japan TOPIX II + MSCI World'],
        ['528','NL','Pays-Bas',11.86,'Oblig. euro + Vanguard Europe'],
        ['156','CN','Chine',11.47,'MSCI Emerging Markets'],
        ['826','GB','Royaume-Uni',7.67,'Vanguard Europe + MSCI World'],
        ['158','TW','Taïwan',7.26,'MSCI Emerging Markets'],
        ['356','IN','Inde',6.88,'MSCI Emerging Markets'],
        ['056','BE','Belgique',6.28,'Obligations euro'],
        ['756','CH','Suisse',5.01,'Vanguard Europe + MSCI World'],
        ['410','KR','Corée du Sud',4.59,'MSCI Emerging Markets'],
        ['076','BR','Brésil',1.91,'MSCI Emerging Markets'],
        ['752','SE','Suède',1.53,'Vanguard Europe'],
        ['208','DK','Danemark',1.53,'Vanguard Europe'],
        ['710','ZA','Afrique du Sud',1.15,'MSCI Emerging Markets'],
        ['484','MX','Mexique',0.96,'MSCI Emerging Markets'],
        ['124','CA','Canada',0.55,'MSCI World'],
        ['036','AU','Australie',0.34,'MSCI World']
      ]
    },
    PEA: {
      total: 1107.70, other: 0,
      sub: 'PEA · 3 lignes en direct',
      note: "Ton PEA est investi à 100 % en France : Schneider Electric, Sidetrade et Engie. Aucune diversification géographique — un choc sur le marché français touche l'intégralité de l'enveloppe.",
      rows: [
        ['250','FR','France',1107.70,'Schneider 539,90 € · Sidetrade 425,00 € · Engie 137,80 € · espèces 5,00 €']
      ]
    },
    AV: {
      total: 495.14, other: 25.13,
      sub: 'Assurance Vie · 9 supports décomposés',
      note: "Le contrat porte toute ta diversification géographique : 49,8 % États-Unis via les deux ETF S&P 500, le reste réparti sur la zone euro, le Japon et les émergents.",
      rows: [
        ['840','US','États-Unis',246.53,'Amundi S&P 500 ×2 + MSCI World'],
        ['250','FR','France',43.89,'Oblig. euro + Vanguard Europe + fonds euro'],
        ['276','DE','Allemagne',37.61,'Oblig. euro + Vanguard Europe'],
        ['380','IT','Italie',32.92,'Oblig. euro + Vanguard Europe'],
        ['724','ES','Espagne',21.62,'Oblig. euro + Vanguard Europe'],
        ['392','JP','Japon',18.47,'Japan TOPIX II + MSCI World'],
        ['528','NL','Pays-Bas',11.87,'Oblig. euro + Vanguard Europe'],
        ['156','CN','Chine',11.47,'MSCI Emerging Markets'],
        ['826','GB','Royaume-Uni',7.67,'Vanguard Europe + MSCI World'],
        ['158','TW','Taïwan',7.26,'MSCI Emerging Markets'],
        ['356','IN','Inde',6.88,'MSCI Emerging Markets'],
        ['056','BE','Belgique',6.28,'Obligations euro'],
        ['756','CH','Suisse',5.01,'Vanguard Europe + MSCI World'],
        ['410','KR','Corée du Sud',4.59,'MSCI Emerging Markets'],
        ['076','BR','Brésil',1.91,'MSCI Emerging Markets'],
        ['752','SE','Suède',1.53,'Vanguard Europe'],
        ['208','DK','Danemark',1.53,'Vanguard Europe'],
        ['710','ZA','Afrique du Sud',1.15,'MSCI Emerging Markets'],
        ['484','MX','Mexique',0.96,'MSCI Emerging Markets'],
        ['124','CA','Canada',0.55,'MSCI World'],
        ['036','AU','Australie',0.34,'MSCI World']
      ]
    }
  };

  /* Détail des instruments par pays : [libellé, type, montant, enveloppe] */
  var HOLD = {
    FR: [
      ['Schneider Electric','Action',539.90,'PEA'],
      ['Sidetrade','Action',425.00,'PEA'],
      ['Engie','Action',137.80,'PEA'],
      ['OAT France via SPDR Euro Aggregate','Obligation',31.20,'AV'],
      ['OAT France via Euro Government 5-7Y','Obligation',9.62,'AV'],
      ['Vanguard FTSE Europe — poche France','ETF',2.51,'AV'],
      ['Fonds euro Spirica','Fonds euro',0.56,'AV'],
      ['Espèces PEA','Liquidités',5.00,'PEA']
    ],
    US: [
      ['Amundi S&P 500 Daily Hedged','ETF',122.87,'AV'],
      ['Amundi Core S&P 500','ETF',111.72,'AV'],
      ['Amundi MSCI World — poche US','ETF',11.94,'AV']
    ],
    DE: [
      ['Bund allemand via SPDR Euro Aggregate','Obligation',28.30,'AV'],
      ['Bund via Euro Government 5-7Y','Obligation',6.79,'AV'],
      ['Vanguard FTSE Europe — poche Allemagne','ETF',2.52,'AV']
    ],
    IT: [
      ['BTP italien via SPDR Euro Aggregate','Obligation',24.44,'AV'],
      ['BTP via Euro Government 5-7Y','Obligation',7.35,'AV'],
      ['Vanguard FTSE Europe — poche Italie','ETF',1.12,'AV']
    ],
    ES: [
      ['Bono espagnol via SPDR Euro Aggregate','Obligation',16.72,'AV'],
      ['Bono via Euro Government 5-7Y','Obligation',3.68,'AV'],
      ['Vanguard FTSE Europe — poche Espagne','ETF',1.22,'AV']
    ],
    JP: [
      ['Amundi Japan TOPIX II','ETF',17.46,'AV'],
      ['Amundi MSCI World — poche Japon','ETF',1.01,'AV']
    ],
    NL: [
      ['DSL néerlandais via SPDR Euro Aggregate','Obligation',8.36,'AV'],
      ['DSL via Euro Government 5-7Y','Obligation',2.24,'AV'],
      ['Vanguard FTSE Europe — poche Pays-Bas','ETF',1.26,'AV']
    ],
    CN: [['Amundi MSCI Emerging Markets — poche Chine','ETF',11.47,'AV']],
    GB: [
      ['Vanguard FTSE Europe — poche Royaume-Uni','ETF',6.87,'AV'],
      ['Amundi MSCI World — poche UK','ETF',0.80,'AV']
    ],
    TW: [['Amundi MSCI Emerging Markets — poche Taïwan','ETF',7.26,'AV']],
    IN: [['Amundi MSCI Emerging Markets — poche Inde','ETF',6.88,'AV']],
    BE: [
      ['OLO belge via SPDR Euro Aggregate','Obligation',4.86,'AV'],
      ['OLO via Euro Government 5-7Y','Obligation',1.42,'AV']
    ],
    CH: [
      ['Vanguard FTSE Europe — poche Suisse','ETF',4.44,'AV'],
      ['Amundi MSCI World — poche Suisse','ETF',0.57,'AV']
    ],
    KR: [['Amundi MSCI Emerging Markets — poche Corée','ETF',4.59,'AV']],
    BR: [['Amundi MSCI Emerging Markets — poche Brésil','ETF',1.91,'AV']],
    SE: [['Vanguard FTSE Europe — poche Suède','ETF',1.53,'AV']],
    DK: [['Vanguard FTSE Europe — poche Danemark','ETF',1.53,'AV']],
    ZA: [['Amundi MSCI Emerging Markets — poche Afrique du Sud','ETF',1.15,'AV']],
    MX: [['Amundi MSCI Emerging Markets — poche Mexique','ETF',0.96,'AV']],
    CA: [['Amundi MSCI World — poche Canada','ETF',0.55,'AV']],
    AU: [['Amundi MSCI World — poche Australie','ETF',0.34,'AV']]
  };
  /* Rampe pensée pour le panneau sombre #16181c */
  var TYPE_COLOR = { 'Action': '#4d84ff', 'ETF': '#e8eaee', 'Obligation': '#7fb0ff', 'Fonds euro': '#8a9099', 'Liquidités': '#4a5058' };

  var SET = SETS[SCOPE];
  var TOTAL = SET.total;
  var OTHER = SET.other;
  var DATA = SET.rows.map(function (r) { return { id: r[0], iso: r[1], name: r[2], v: r[3], src: r[4] }; });
  document.getElementById('sub').textContent = SET.sub;
  document.getElementById('note').textContent = SET.note + ' Touche un pays pour voir les instruments concernés.';

  var byId = {};
  DATA.forEach(function (d) { d.pct = d.v / TOTAL * 100; byId[d.id] = d; });

  var eur = function (n) { return n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; };
  var eur0 = function (n) { return Math.round(n).toLocaleString('fr-FR') + ' €'; };
  var pct = function (n) { return n.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %'; };

  var NODATA = '#f2f3f5';
  var STEPS = [0.5, 1, 3, 10, 30];
  var COLORS = ['#dbe6ff', '#b3caff', '#7aa5ff', '#3d79ff', '#0052ff', '#0038b3'];
  var color = d3.scaleThreshold().domain(STEPS).range(COLORS);

  d3.select('#ramp').selectAll('i').data(COLORS).enter().append('i').style('background', function (c) { return c; });

  var tip = d3.select('#tip'), stage = document.getElementById('stage');
  function showTip(html, ev) {
    var r = stage.getBoundingClientRect();
    var x = ev.clientX - r.left, y = ev.clientY - r.top;
    tip.html(html).style('opacity', 1);
    var tw = tip.node().offsetWidth, th = tip.node().offsetHeight;
    tip.style('left', Math.max(4, Math.min(r.width - tw - 4, x - tw / 2)) + 'px')
       .style('top', Math.max(4, y - th - 12) + 'px');
  }
  function hideTip() { tip.style('opacity', 0); }
  function tipHtml(d) {
    return '<b>' + d.name + '</b><br><span class="v">' + pct(d.pct) + ' · ' + eur(d.v) + '</span><br>' + d.src;
  }

  /* ---- liste partagée carte / cercle ---- */
  var TOP = 8;
  var rest = DATA.slice(TOP).reduce(function (s, d) { return s + d.v; }, 0) + OTHER;
  var restCount = DATA.length - TOP;
  var listRows = DATA.slice(0, TOP);
  if (rest > 0.005) listRows = listRows.concat([{
    iso: '·', name: restCount > 0 ? 'Autres pays (' + restCount + ')' : 'Autres pays',
    v: rest, pct: rest / TOTAL * 100,
    src: restCount > 0 ? DATA.slice(TOP, TOP + 4).map(function (d) { return d.name; }).join(', ') + '…' : 'Reste des sous-jacents'
  }]);
  var list = d3.select('#list').selectAll('.row').data(listRows).enter().append('div')
    .attr('class', 'row')
    .on('mouseenter', function (ev, d) { select(d.iso); })
    .on('mouseleave', function () { select(null); })
    .on('click', function (ev, d) { if (d.iso === '·') { closeDetail(); return; } openIso === d.iso ? closeDetail() : openDetail(d.iso); });
  var pieColors = ['#0052ff', '#0a0b0d', '#4d84ff', '#5b616e', '#99b7ff', '#a8acb3', '#c8ccd2', '#dee1e6', '#eef0f3'];
  var dots = list.append('span').attr('class', 'dot');
  function paintDots(mapView) {
    dots.style('background', function (d, i) { return mapView ? (d.iso === '·' ? '#c8ccd2' : color(d.pct)) : pieColors[i % pieColors.length]; });
  }
  paintDots(true);
  list.append('span').attr('class', 'nm').text(function (d) { return d.name; });
  list.append('span').attr('class', 'pc mono').text(function (d) { return pct(d.pct); });
  list.append('span').attr('class', 'am mono').text(function (d) { return eur0(d.v); });

  document.getElementById('ctrA').textContent = eur(TOTAL);

  var openIso = null;

  function typeAgg(items) {
    var order = ['Action','ETF','Obligation','Fonds euro','Liquidités'], m = {};
    items.forEach(function (h) { m[h[1]] = (m[h[1]] || 0) + h[2]; });
    return order.filter(function (t) { return m[t]; }).map(function (t) { return { type: t, v: m[t] }; });
  }

  function openDetail(iso) {
    var d = DATA.filter(function (x) { return x.iso === iso; })[0];
    var items = HOLD[iso];
    if (!d || !items) { closeDetail(); return; }
    if (SCOPE === 'PEA') items = items.filter(function (h) { return h[3] === 'PEA'; });
    if (SCOPE === 'AV') items = items.filter(function (h) { return h[3] === 'AV'; });
    if (!items.length) { closeDetail(); return; }
    openIso = iso;
    var sum = items.reduce(function (s, h) { return s + h[2]; }, 0);
    document.getElementById('dName').textContent = d.name;
    document.getElementById('dMeta').textContent = pct(d.pct) + ' · ' + eur(d.v) + ' · ' + items.length + (items.length > 1 ? ' instruments' : ' instrument');
    var agg = typeAgg(items);
    d3.select('#dMix').selectAll('i').data(agg).join('i')
      .style('flex', function (t) { return t.v; })
      .style('background', function (t) { return TYPE_COLOR[t.type]; });
    var tg = d3.select('#dTypes').selectAll('.tg').data(agg).join('div').attr('class', 'tg');
    tg.selectAll('*').remove();
    tg.append('i').style('background', function (t) { return TYPE_COLOR[t.type]; });
    tg.append('span').text(function (t) { return t.type; });
    tg.append('b').text(function (t) { return pct(t.v / sum * 100); });
    var hr = d3.select('#dRows').selectAll('.hr').data(items.slice().sort(function (a, b) { return b[2] - a[2]; })).join('div').attr('class', 'hr');
    hr.selectAll('*').remove();
    hr.append('i').style('background', function (h) { return TYPE_COLOR[h[1]]; });
    var b = hr.append('div').attr('class', 'hrb');
    b.append('div').attr('class', 'hrn').text(function (h) { return h[0]; });
    b.append('div').attr('class', 'hrt').text(function (h) { return h[1] + ' · ' + (h[3] === 'PEA' ? 'PEA' : 'Assurance vie'); });
    hr.append('div').attr('class', 'hra').text(function (h) { return eur(h[2]); });
    document.getElementById('detail').classList.remove('hide');
    report();
  }
  function closeDetail() {
    openIso = null;
    document.getElementById('detail').classList.add('hide');
    report();
  }
  document.getElementById('dClose').onclick = closeDetail;

  var sel = null;
  function select(iso) {
    sel = iso;
    d3.selectAll('.country').attr('opacity', function (f) {
      var d = byId[String(+f.id).padStart(3, '0')] || byId[f.id];
      if (!sel) return 1;
      return d && d.iso === sel ? 1 : 0.35;
    });
    d3.selectAll('.arc').attr('opacity', function (d) { return !sel || d.data.iso === sel ? 1 : 0.35; });
    list.classed('sel', function (d) { return d.iso === sel; });
    var f = listRows.filter(function (d) { return d.iso === sel; })[0];
    document.getElementById('ctrP').textContent = f ? pct(f.pct) : '100 %';
    document.getElementById('ctrL').textContent = f ? f.name : "de l'exposition";
    document.getElementById('ctrA').textContent = f ? eur(f.v) : eur(TOTAL);
  }

  /* ---- carte ---- */
  var W = 640, H = 330;
  var svg = d3.select('#map');
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(function (topo) {
    var feats = topojson.feature(topo, topo.objects.countries).features;
    var proj = d3.geoNaturalEarth1().fitSize([W, H], { type: 'FeatureCollection', features: feats });
    var path = d3.geoPath(proj);
    svg.append('g').selectAll('path').data(feats).enter().append('path')
      .attr('class', 'country')
      .attr('d', path)
      .attr('fill', function (f) {
        var d = byId[String(+f.id).padStart(3, '0')];
        return d ? color(d.pct) : NODATA;
      })
      .on('mousemove', function (ev, f) {
        var d = byId[String(+f.id).padStart(3, '0')];
        if (d) { showTip(tipHtml(d), ev); select(d.iso); }
        else { showTip('<b>' + (f.properties && f.properties.name ? f.properties.name : 'Hors portefeuille') + '</b><br><span class="v">0,0 %</span><br>Aucune exposition', ev); }
      })
      .on('mouseleave', function () { hideTip(); select(null); })
      .on('click', function (ev, f) {
        var d = byId[String(+f.id).padStart(3, '0')];
        if (!d) { closeDetail(); return; }
        openIso === d.iso ? closeDetail() : openDetail(d.iso);
      });
    report();
  }).catch(function () {
    svg.append('text').attr('x', W / 2).attr('y', H / 2).attr('text-anchor', 'middle')
      .attr('fill', '#a8acb3').style('font-size', '13px').text('Carte indisponible hors ligne');
  });

  /* ---- diagramme circulaire ---- */
  var pieData = listRows;
  var arcs = d3.pie().sort(null).padAngle(0.012).value(function (d) { return d.v; })(pieData);
  var arc = d3.arc().innerRadius(74).outerRadius(112).cornerRadius(2);
  d3.select('#pie').append('g').attr('transform', 'translate(120,120)')
    .selectAll('path').data(arcs).enter().append('path')
    .attr('class', 'arc').attr('d', arc)
    .attr('fill', function (d, i) { return pieColors[i % pieColors.length]; })
    .on('mousemove', function (ev, d) { showTip(tipHtml(d.data), ev); select(d.data.iso); })
    .on('mouseleave', function () { hideTip(); select(null); })
    .on('click', function (ev, d) { if (d.data.iso === '·') { closeDetail(); return; } openIso === d.data.iso ? closeDetail() : openDetail(d.data.iso); });

  /* ---- bascule carte / cercle ---- */
  var bMap = document.getElementById('bMap'), bPie = document.getElementById('bPie');
  var mapWrap = document.getElementById('mapWrap'), pieWrap = document.getElementById('pieWrap');
  var legend = document.getElementById('legend');
  function setView(m) {
    bMap.classList.toggle('on', m); bPie.classList.toggle('on', !m);
    mapWrap.classList.toggle('hide', !m); pieWrap.classList.toggle('hide', m);
    legend.classList.toggle('hide', !m);
    paintDots(m);
    hideTip(); select(null); report();
  }
  bMap.onclick = function () { setView(true); };
  bPie.onclick = function () { setView(false); };
})();
</script>
</body>
</html>
