<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<title>Patrimoine</title>
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="icon" href="/m/icon-192.png">
<!-- ?v= : incrémenter à chaque déploiement touchant ces fichiers (cf. index.html). -->
<script src="/firebase-config.js?v=10"></script>
<script src="/app-core.js?v=10"></script>
<script src="/ui-kit.js?v=10"></script>
<script type="module" src="/firebase-client.js?v=10"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0052ff; --blue-d:#003ecc;
  --green:#05b169; --green-bg:#e8f8f0; --red:#cf202f; --red-bg:#fff0f1;
  --ink:#0a0b0d; --mut:#5b616e; --mut2:#7c828a; --mut3:#a8acb3;
  --line:#dee1e6; --line2:#eef0f3; --line3:#f2f3f5;
  --bg:#f7f7f7; --white:#fff; --dark:#0a0b0d;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,system-ui,Roboto,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;position:relative}

/* ---------- barre haute ---------- */
.top{
  background:var(--white);border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top)) 20px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;
}
.top h1{font-size:17px;font-weight:600;letter-spacing:-.3px;line-height:1.2;margin:0}
.top-sub{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;color:var(--mut2)}
.dot{width:5px;height:5px;border-radius:9999px;background:var(--green);display:inline-block;flex:none}
.dot.warn{background:#b7791f}
.dot.off{background:var(--mut3)}
.dot.live{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.icon-btn{width:38px;height:38px;border-radius:9999px;background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit;display:flex;align-items:center;justify-content:center;flex:none;border:0;padding:0;cursor:pointer}
.icon-btn:active{background:var(--line2)}
.icon-btn.primary{background:var(--blue)}
.icon-btn.primary:active{background:var(--blue-d)}

/* ---------- contenu ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{display:none}
main{scrollbar-width:none}
.screen{padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:20px}
.card.tight{padding:8px 20px}
.card-t{font-size:15px;font-weight:600;letter-spacing:-.1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--mut2)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut2)}
.big{font-family:var(--mono);font-size:36px;font-weight:500;letter-spacing:-1.4px;margin-top:8px;font-variant-numeric:tabular-nums}
.badge{background:var(--green-bg);border-radius:100px;padding:3px 9px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--green)}
.badge.down{background:var(--red-bg);color:var(--red)}
.badge.flat{background:var(--line2);color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:12px}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--bg)}
.list-row:last-child{border-bottom:0}
.ava{width:38px;height:38px;border-radius:9999px;background:var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.ava.sm{width:34px;height:34px;font-size:11px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 12px;border-radius:100px;font-size:13px;font-weight:600;white-space:nowrap;flex:none;background:var(--white);color:var(--mut);border:1px solid var(--line);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.segbar{display:flex;background:var(--line2);border-radius:100px;padding:4px;gap:2px}
.seg{flex:1;text-align:center;padding:9px 12px;border-radius:100px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}
.seg.on{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar{display:flex;border-radius:9px;overflow:hidden;gap:2px}
.track{height:8px;border-radius:4px;background:var(--line2)}
.track .fill{height:100%;border-radius:4px;background:var(--blue)}
.dark{background:var(--dark);border-radius:20px;padding:20px;color:#fff}
.dark .k{font-size:13px;color:var(--mut3)}
.dark .v{font-family:var(--mono);font-size:13px;color:#fff;white-space:nowrap}
.btn-w{margin-top:16px;height:44px;border-radius:100px;background:#fff;color:var(--ink);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:0;width:100%;font-family:inherit}
.hint{font-size:11px;color:var(--mut3);margin-top:9px}
.tipbox{background:var(--bg);border-radius:14px;padding:14px 16px;margin-top:14px}
.empty{padding:28px 12px;text-align:center;color:var(--mut2);font-size:14px}
.note{font-size:13px;color:var(--mut);line-height:1.55;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.alert{background:#f7f9ff;border:1px solid #cfdcff;border-radius:20px;padding:18px;display:flex;gap:12px;align-items:flex-start}
.alert .bang{width:22px;height:22px;border-radius:9999px;background:var(--blue);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}

/* ---------- nav basse ---------- */
.nav{
  background:var(--white);border-top:1px solid var(--line);
  padding:8px 16px calc(10px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:none;
}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:14px;cursor:pointer;background:transparent;border:0;font-family:inherit}
.nav-item.on{background:var(--line2)}
.nav-item span{font-size:11px;font-weight:600;color:var(--mut2);white-space:nowrap}
.nav-item.on span{color:var(--ink)}

/* ---------- bottom sheet ---------- */
.sheet-bg{position:absolute;inset:0;background:rgba(10,11,13,.5);display:flex;align-items:flex-end;z-index:40}
.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;max-height:88dvh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(18px)}to{transform:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.drop{border:2px dashed var(--blue);border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px;background:#f7f9ff;text-align:center;cursor:pointer}
.drop.over{background:#eaf0ff}
.code{background:var(--bg);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--mut)}
.btn-p{height:48px;border-radius:100px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;width:100%;font-family:inherit}
.btn-p[disabled]{opacity:.5}
.btn-s{height:44px;border-radius:100px;background:var(--white);color:var(--ink);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--line);width:100%;font-family:inherit}
.btn-s.danger,.linkbtn.danger{color:var(--red)}
.linkbtn{background:none;border:0;padding:6px 4px;font:600 13px/1 inherit;font-family:inherit;color:var(--blue);cursor:pointer;flex:none}
.link{color:var(--blue);font-weight:600;cursor:pointer}
.chips[style*="flex-wrap"]{overflow:visible}
.field input[type=date]{min-width:0;width:100%}
.report{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55}
.report.ok{background:#f0fdf6;border:1px solid #b9ecd2;color:#0a5c3a}
.report.err{background:#fff5f5;border:1px solid #f3c9cd;color:#8c1620}
.report.busy{background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--mut3);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- auth ---------- */
.auth-shell{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:380px}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--mut)}
.field input{width:100%;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff}
.field input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.auth-error{background:#fff5f5;border:1px solid #f3c9cd;color:#8c1620;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px;line-height:1.5}
.auth-alt{text-align:center;margin-top:16px;font-size:13px;color:var(--mut)}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--mut3);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-google{height:46px;border-radius:100px;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;width:100%;font-family:inherit}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="picker" accept=".csv,.txt,.tsv,.xlsx,.xlsm" style="display:none">

<script>
"use strict";

/* ============================================================
   Constantes. Aucune donnée de démonstration : tout ce qui s'affiche est
   calculé sur les opérations, lignes et soldes de l'utilisateur.
   ============================================================ */
const PAL = ['#0052ff','#0a0b0d','#4d84ff','#5b616e','#99b7ff','#a8acb3','#c8ccd2','#dee1e6','#eef0f3'];
const MSHORT = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MLONG = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const HIDDEN = '•••• €';
const OPICON = { Achat:'↓', Vente:'↑', Versement:'+', Dividende:'€', Ouverture:'★', Retrait:'−' };
const OP_TYPES = ['Versement', 'Retrait', 'Achat', 'Vente', 'Dividende', 'Ouverture'];
const BASE_COMPTES = ['PEA', 'CTO', 'Assurance Vie', 'PER', 'Livret A', 'LDDS', 'LEP'];

/* Réglages personnels : aucune valeur inventée tant que l'utilisateur n'a rien renseigné. */
const depensesMensuelles = () => snap?.settings?.monthlyExpenses || null;
const matelas = valeur => {
  const m = depensesMensuelles();
  return m ? (valeur / m).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' mois' : 'à renseigner';
};

/** Ancienneté d'une enveloppe et part du délai fiscal écoulée, depuis sa première opération. */
function premiereOp(compteName){
  const iso = snap?.comptes?.[compteName]?.premiereOperation;
  if (!iso) return null;
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? null : d;
}
function anciennete(compteName){
  const d = premiereOp(compteName);
  if (!d) return '—';
  const mois = Math.max(0, Math.round((Date.now() - d) / (30.44 * 86400000)));
  return mois >= 24 ? `${Math.floor(mois / 12)} ans` : `${mois} mois`;
}
function anciennetePct(compteName, years){
  const d = premiereOp(compteName);
  if (!d) return 0;
  return Math.max(0, Math.min(100, (Date.now() - d) / (365.25 * 86400000) / years * 100));
}

/* ============================================================
   Formatage
   ============================================================ */
const eur  = n => (n ?? 0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const eur0 = n => Math.round(n ?? 0).toLocaleString('fr-FR') + ' €';
const pctS = n => (n ?? 0).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' %';
const num2 = n => Math.abs(n ?? 0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const sgn  = n => n > 0 ? '+' : (n < 0 ? '−' : '');
const sEur = n => sgn(n) + num2(n) + ' €';
const sPct = n => sgn(n) + num2(n) + ' %';
const kls  = n => n > 0 ? 'pos' : (n < 0 ? 'neg' : '');
const esc  = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const abbr = s => (s || '?').replace(/[^A-Za-zÀ-ÿ ]/g,'').split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
const frDate = s => s ? s.slice(8) + '/' + s.slice(5,7) : '';
const mLabel = s => s ? MSHORT[+s.slice(5,7)-1] + ' ' + s.slice(2,4) : '';
const mLong  = s => s ? MLONG[+s.slice(5,7)-1] + ' ' + s.slice(0,4) : '';

/* masquage des montants (œil dans la barre haute) */
const money  = txt => state.hide ? HIDDEN : txt;
const mEur   = n => state.hide ? HIDDEN : eur(n);
const mEur0  = n => state.hide ? HIDDEN : eur0(n);
const mSEur  = n => state.hide ? HIDDEN : sEur(n);

/* ============================================================
   État
   ============================================================ */
const state = {
  screen:'accueil', mode:'env', env:'PEA', scope:'Tout', tab:'titre',
  seg:null, filt:'Tous', sheet:false, sheetTab:'saisie', formCompte:'PEA', editing:null,
  hov:null, hide: readPref('hideAmounts') === '1',
  importing:false, report:null,
  user:undefined                     // undefined = état d'auth pas encore connu, null = déconnecté
};
let snap = null;
let conn = { status:'connecting', at:null, error:null };
let dataError = null;
let unsubData = null;
const UI = window.PatrimoineUI;

/* Raccourcis de l'app installée (manifest) : ?screen=ops, ?action=add */
const START = (() => {
  const p = new URLSearchParams(location.search);
  return { screen: ['accueil','portefeuille','ops'].includes(p.get('screen')) ? p.get('screen') : 'accueil', sheet: /^(add|import)$/.test(p.get('action') || '') };
})();

/* localStorage peut être indisponible (navigation privée, stockage bloqué) */
function readPref(k){ try { return localStorage.getItem(k); } catch { return null; } }
function writePref(k, v){ try { localStorage.setItem(k, v); } catch { /* préférence non conservée */ } }

function set(patch){
  let changed = false;
  for (const k in patch) if (state[k] !== patch[k]) { state[k] = patch[k]; changed = true; }
  if (changed) render();
}

/* ============================================================
   Auth + données (Firebase — voir /firebase-client.js)
   Le SDK Firestore gère la persistance hors-ligne (IndexedDB).
   ============================================================ */

function subscribeData(){
  unsubData?.();
  dataError = null;
  unsubData = window.PatrimoineData.onSnapshot(
    s => {
      snap = s;
      dataError = null;
      if (s) conn = { status: s.quotes?.failed?.length ? 'partial' : 'live', at: Date.now(), error: null };
      render();
    },
    message => { dataError = message; render(); }
  );
}

function unsubscribeData(){
  unsubData?.(); unsubData = null;
  snap = null; dataError = null;
}

function handleUser(user){
  const changed = (state.user?.uid || null) !== (user?.uid || null) || state.user === undefined;
  state.user = user;
  if (!changed) return;
  if (user) subscribeData(); else unsubscribeData();
  Object.assign(state, { screen:START.screen, sheet:!!user && START.sheet, editing:null, report:null });
  START.sheet = false;
  render();
}

function boot(){ window.PatrimoineAuth.onUser(handleUser); }

/** Sens réel d'une opération, quel que soit le signe utilisé par le fichier d'origine. */
const opAmount = o => (o.type === 'Achat' || o.type === 'Retrait') ? -Math.abs(o.montant) : Math.abs(o.montant);
const isSoldeCompte = c => window.PatrimoineCore.isSoldeCompte(c);
const rawCash = () => window.PatrimoineData?.portfolio?.cash || {};

/** Explique d'où vient une trésorerie déduite des opérations. */
function cashExplain(compteName){
  const d = snap?.cashDetail?.[compteName];
  if (!d) return 'déduites de tes opérations';
  const parts = [];
  const entrees = (d.Versement || 0) + (d.Ouverture || 0);
  if (entrees) parts.push(`${eur0(entrees)} versés`);
  if (d.Vente) parts.push(`${eur0(d.Vente)} de ventes`);
  if (d.Dividende) parts.push(`${eur0(d.Dividende)} de dividendes`);
  if (d.Achat) parts.push(`− ${eur0(d.Achat)} investis`);
  if (d.Retrait) parts.push(`− ${eur0(d.Retrait)} retirés`);
  return parts.length ? `${parts.join(' · ')} (${d.count} opérations)` : 'déduites de tes opérations';
}

/* ============================================================
   Sélecteurs
   ============================================================ */
const T = () => snap?.totals || {};
const compte = n => snap?.comptes?.[n] || { value:0, mise:0, pv:0, pvPct:0, lines:[], cash:0 };
const comptes = () => Object.keys(snap?.comptes || {});
const hist = () => snap?.history || [];

function chart(points, W, H, pad = 10){
  if (points.length < 2) return null;
  const vals = points.flatMap(p => [p.val, p.cap]);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (max === min) { max += 1; min -= 1; }
  const span = max - min; min -= span * .12; max += span * .12;
  const x = i => i * W / (points.length - 1);
  const y = v => pad + (max - v) / (max - min) * (H - 2 * pad);
  const line = k => points.map((p,i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join(' ');
  const area = line('val') + ' ' + points.map((_,i) => {
    const j = points.length - 1 - i;
    return `L${x(j).toFixed(1)},${y(points[j].cap).toFixed(1)}`;
  }).join(' ') + ' Z';
  return { valPath:line('val'), capPath:line('cap'), areaPath:area, x, y, lastX:x(points.length-1), lastY:y(points[points.length-1].val) };
}

/* ============================================================
   Barre haute
   ============================================================ */
function status(){
  if (navigator.onLine === false) return { dot:'off', text:'Hors ligne · dernières valeurs connues' };
  const failed = snap?.quotes?.failed?.length || 0;
  const total = (snap?.lines || []).length;
  const age = conn.at ? Math.round((Date.now() - conn.at) / 1000) : null;
  const when = age == null ? '' : (age < 90 ? `il y a ${age} s` : `il y a ${Math.round(age/60)} min`);
  if (!snap?.live) return { dot:'off', text: total ? 'Derniers cours connus' : 'Patrimoine' };
  if (failed) return { dot:'warn', text:`${total - failed}/${total} cotations · ${when}` };
  return { dot:'live', text:`À jour · ${when}` };
}

function header(){
  const s = status();
  const titles = {
    accueil: ['Patrimoine', s.text],
    portefeuille: [state.mode === 'env' ? 'Portefeuille' : 'Répartition',
                   state.mode === 'env' ? `${comptes().length} enveloppes suivies` : (state.scope === 'Tout' ? 'Tout le patrimoine' : state.scope)],
    ops: ['Activité', `${(snap?.operations || []).length} opérations`]
  };
  const t = titles[state.screen];
  return `
  <div class="top">
    <div>
      <h1>${t[0]}</h1>
      <div class="top-sub"><span class="dot ${s.dot}"></span><span>${t[1]}</span></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" data-act="hide" aria-label="${state.hide ? 'Afficher' : 'Masquer'} les montants">
        ${state.hide
          ? `<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z" stroke="#5b616e" stroke-width="1.5"/><path d="M3 3l14 14" stroke="#5b616e" stroke-width="1.5" stroke-linecap="round"/></svg>`
          : `<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z" stroke="#5b616e" stroke-width="1.5"/><circle cx="10" cy="10" r="2.2" stroke="#5b616e" stroke-width="1.5"/></svg>`}
      </button>
      <button class="icon-btn primary" data-act="sheet" data-arg="1" aria-label="Ajouter une ligne ou importer un fichier">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>`;
}

/* ============================================================
   Écran Accueil
   ============================================================ */
function screenAccueil(){
  const t = T();
  const pts = hist().slice(-12);
  const c = chart(pts, 340, 130, 14);
  const hi = state.hov == null ? pts.length - 1 : Math.min(state.hov, pts.length - 1);
  const p = pts[hi];
  const gain = p ? p.val - p.cap : 0;

  const zones = pts.map((_,i) => `<div data-act="hov" data-arg="${i}" style="flex:1"></div>`).join('');
  const axis = pts.length > 3
    ? [0, Math.floor(pts.length/3), Math.floor(2*pts.length/3), pts.length-1]
        .filter((v,i,a) => a.indexOf(v) === i).map(i => `<span style="font-size:10px;color:var(--mut3)">${mLabel(pts[i].date)}</span>`).join('')
    : '';

  const envCards = comptes().map(name => {
    const e = compte(name);
    const garanti = !!e.garanti && !e.lines.length;
    return `
    <div class="list-row" data-act="env" data-arg="${esc(name)}">
      <div class="ava">${esc(abbr(name))}</div>
      <div class="grow">
        <div class="ell" style="font-size:15px;font-weight:600">${esc(name)}</div>
        <div class="ell" style="font-size:12px;color:var(--mut2)">${garanti ? `Épargne garantie · ${e.taux ? pctS(e.taux) : 'taux non renseigné'}` : `${e.lines.length} ligne${e.lines.length > 1 ? 's' : ''}${e.cash ? ' + liquidités' : ''}`}</div>
      </div>
      <div style="text-align:right;flex:none">
        <div class="mono" style="font-size:15px;font-weight:500">${mEur0(e.value)}</div>
        <div class="mono ${garanti ? 'muted' : kls(e.pvPct)}" style="font-size:12px;font-weight:600;margin-top:2px">${garanti ? 'garanti' : sPct(e.pvPct)}</div>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" style="flex:none"><path d="M1 1l6 6-6 6" stroke="#c8ccd2" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>`;
  }).join('');

  // épargne de précaution : le plus gros livret réellement présent
  const livret = comptes().map(compte).filter(e => e.garanti && !e.lines.length).sort((a, b) => b.value - a.value)[0];
  const part = livret && t.patrimoine ? livret.value / t.patrimoine * 100 : 0;

  return `<div class="screen">
    <div class="card">
      <div class="lbl">Patrimoine total</div>
      <div class="big">${mEur(t.patrimoine)}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap">
        <span class="badge ${t.pv >= 0 ? '' : 'down'}">${t.pv >= 0 ? '▲' : '▼'} ${sPct(t.pvPct)}</span>
        <span class="mono ${kls(t.pv)}" style="font-size:13px;font-weight:500">${mSEur(t.pv)}</span>
        <span style="font-size:12px;color:var(--mut2)">${t.premiereOperation ? 'depuis ' + mLabel(t.premiereOperation) : ''}</span>
      </div>

      ${c ? `
      <div style="position:relative;margin-top:18px">
        <svg width="100%" height="124" viewBox="0 0 340 130" preserveAspectRatio="none" style="display:block">
          <path d="${c.areaPath}" fill="${t.pv >= 0 ? '#05b169' : '#cf202f'}" fill-opacity="0.12"/>
          <path d="${c.capPath}" fill="none" stroke="#a8acb3" stroke-width="1.8" stroke-dasharray="4 3"/>
          <path d="${c.valPath}" fill="none" stroke="${t.pv >= 0 ? '#05b169' : '#cf202f'}" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="${c.x(hi)}" cy="${c.y(pts[hi].val)}" r="4" fill="${t.pv >= 0 ? '#05b169' : '#cf202f'}"></circle>
        </svg>
        <div style="position:absolute;inset:0;display:flex">${zones}</div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:6px">${axis}</div>

      <div class="tipbox">
        <div class="row" style="align-items:baseline">
          <span class="lbl">${mLong(p.date)}</span>
          <span class="mono ${kls(gain)}" style="font-size:12px;font-weight:600">${sPct(p.cap ? gain/p.cap*100 : 0)}</span>
        </div>
        <div class="row" style="margin-top:8px"><span style="font-size:13px;color:var(--mut)">Patrimoine</span><span class="mono" style="font-size:13px;font-weight:500">${mEur(p.val)}</span></div>
        <div class="row" style="margin-top:5px"><span style="font-size:13px;color:var(--mut)">Capital versé</span><span class="mono" style="font-size:13px;font-weight:500">${mEur(p.cap)}</span></div>
        <div class="row" style="margin-top:5px"><span style="font-size:13px;color:var(--mut)">Gains</span><span class="mono ${kls(gain)}" style="font-size:13px;font-weight:600">${mSEur(gain)}</span></div>
        <div class="hint">Touche la courbe pour changer de jour</div>
      </div>` : '<div class="empty" style="padding:20px 8px">L\'historique se construit jour après jour, à chaque valorisation.</div>'}

      <div class="bar" style="height:34px;margin-top:16px">
        <div style="flex:${Math.max(1, t.capital)};background:var(--line2);display:flex;align-items:center;padding-left:12px"><span class="mono" style="font-size:12px;font-weight:500;white-space:nowrap">${mEur(t.capital)}</span></div>
        <div style="flex:${Math.max(1, Math.abs(t.pv))};background:${t.pv >= 0 ? 'var(--green)' : 'var(--red)'};display:flex;align-items:center;justify-content:center;min-width:54px"><span class="mono" style="font-size:11px;font-weight:600;color:#fff;white-space:nowrap">${state.hide ? '••' : sEur(t.pv)}</span></div>
      </div>
      <div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:6px"><span style="width:9px;height:9px;border-radius:2px;background:var(--line2);border:1px solid var(--line);display:inline-block"></span><span style="font-size:12px;color:var(--mut)">Capital versé</span></div>
        <div style="display:flex;align-items:center;gap:6px"><span style="width:9px;height:9px;border-radius:2px;background:${t.pv >= 0 ? 'var(--green)' : 'var(--red)'};display:inline-block"></span><span style="font-size:12px;color:var(--mut)">${t.pv >= 0 ? 'Gains' : 'Pertes'} ${pctS(Math.abs(t.capital ? t.pv/t.capital*100 : 0))}</span></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line2)">
        <div><div style="font-size:11px;color:var(--mut2)">PV latentes</div><div class="mono ${kls(t.pv)}" style="font-size:15px;font-weight:500;margin-top:3px;white-space:nowrap">${mSEur(t.pv)}</div></div>
        <div><div style="font-size:11px;color:var(--mut2)">Dividendes</div><div class="mono pos" style="font-size:15px;font-weight:500;margin-top:3px;white-space:nowrap">${mSEur(divTotal())}</div></div>
        <div><div style="font-size:11px;color:var(--mut2)">Versé ce mois</div><div class="mono" style="font-size:15px;font-weight:500;margin-top:3px;white-space:nowrap">${mSEur(t.epargneMois || 0)}</div></div>
      </div>
    </div>

    <div class="card tight">${envCards || `<div class="empty">Aucune enveloppe pour l'instant.<br><span class="link" data-act="sheet" data-arg="1">Ajouter ma première ligne →</span></div>`}</div>

    ${livret && comptes().length > 1 ? `
    <div class="dark">
      <div class="lbl" style="color:var(--mut3)">Épargne de précaution</div>
      <div style="font-size:17px;font-weight:400;letter-spacing:-.3px;margin-top:8px;line-height:1.35">${esc(livret.name)} représente ${pctS(part)} de ton patrimoine${livret.taux ? `, rémunéré à ${pctS(livret.taux)}` : ''}.</div>
      <div style="font-size:13px;color:var(--mut3);line-height:1.55;margin-top:10px">${depensesMensuelles() ? `Il couvre ${matelas(livret.value)} de dépenses. ` : ''}Une épargne de précaution couvre en général 3 à 6 mois de dépenses.</div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:14px">
        ${comptes().map(n => `<div class="row"><span class="k ell">${esc(n)}</span><span class="v">${mEur(compte(n).value)}</span></div>`).join('')}
      </div>
      ${livret.plafond ? `
      <div class="row" style="margin-top:14px;padding-top:14px;border-top:1px solid #2a2f37">
        <span class="k">Encore versable sur ${esc(livret.name)}</span><span class="v" style="font-weight:600">${mEur0(Math.max(0, livret.plafond - livret.value))}</span>
      </div>` : ''}
      <button class="btn-w" data-act="env" data-arg="${esc(livret.name)}">Ouvrir ${esc(livret.name)} →</button>
    </div>` : ''}
  </div>`;
}

function divTotal(){
  const d = snap?.dividends || {};
  return Object.values(d).reduce((s,y) => s + (y.total || 0), 0);
}

/* ============================================================
   Écran Portefeuille — mode Enveloppes
   ============================================================ */
function modeEnveloppes(){
  const list = comptes();
  if (!list.length) return `<div class="card"><div class="empty">Aucune enveloppe pour l'instant.<br><span class="link" data-act="sheet" data-arg="1">Ajouter une ligne →</span></div></div>`;
  const name = list.includes(state.env) ? state.env : list[0];
  const e = compte(name);
  const garanti = !!e.garanti && !e.lines.length;

  const chips = list.map(n => `<div class="chip${n === name ? ' on' : ''}" data-act="env" data-arg="${esc(n)}">${esc(n)}</div>`).join('');
  const byPct = [...e.lines].sort((a, b) => b.pct - a.pct);

  const stats = garanti
    ? [['Solde', mEur(e.value), 0], ['Intérêts estimés', e.interets ? mSEur(e.interets) : '—', 1],
       ['Taux renseigné', e.taux ? pctS(e.taux) : '—', 0], ['Matelas de sécurité', matelas(e.value), 0]]
    : [['Mise', mEur(e.mise), 0],
       ['Dividendes ' + new Date().getFullYear(), mSEur(divFor(name)), 1],
       ['Meilleure ligne', byPct[0] ? `${byPct[0].name.slice(0,18)} ${sPct(byPct[0].pct)}` : '—', byPct[0] && byPct[0].pct < 0 ? -1 : 1],
       ['Moins bonne', byPct.length > 1 ? `${byPct[byPct.length-1].name.slice(0,18)} ${sPct(byPct[byPct.length-1].pct)}` : '—', byPct.length > 1 && byPct[byPct.length-1].pct < 0 ? -1 : 1]];

  const gauge = e.plafond
    ? (garanti
        ? { label:'Plafond réglementaire', value:`${Math.round(e.value).toLocaleString('fr-FR')} / ${e.plafond.toLocaleString('fr-FR')} €`, pct: e.value / e.plafond * 100 }
        : { label:'Plafond de versement', value:`${Math.round(e.mise).toLocaleString('fr-FR')} / ${e.plafond.toLocaleString('fr-FR')} €`, pct: e.mise / e.plafond * 100 })
    : (/assurance|vie|\bper\b/i.test(name) ? { label:'Antériorité fiscale', value:`${anciennete(name)} / 8 ans`, pct: anciennetePct(name, 8) } : null);

  const lines = e.lines.map(l => `
    <div class="list-row" data-act="editLine" data-arg="${(snap?.lines || []).indexOf(l)}">
      <div class="ava sm">${esc(abbr(l.name))}</div>
      <div class="grow">
        <div class="ell" style="font-size:14px;font-weight:500">${esc(l.name)}</div>
        <div class="ell" style="font-size:12px;color:var(--mut2)">${esc([l.symbol || l.ticker, l.qty != null ? (l.qty.toLocaleString('fr-FR', { maximumFractionDigits:4 }) + ' × ' + eur(l.pru)) : '', l.manual ? 'non coté' : (l.live ? '' : 'cours différé')].filter(Boolean).join(' · '))}</div>
      </div>
      <div style="text-align:right;flex:none">
        <div class="mono" style="font-size:14px;font-weight:500">${mEur(l.value)}</div>
        <div class="mono ${kls(l.pct)}" style="font-size:12px;font-weight:600;margin-top:2px">${sPct(l.pct)}</div>
      </div>
    </div>`).join('');

  const showCash = e.cash || rawCash()[name] != null;
  const cash = showCash ? `
    <div class="list-row" data-act="editCash" data-arg="${esc(name)}">
      <div class="ava sm">€</div>
      <div class="grow"><div style="font-size:14px;font-weight:500">Liquidités</div><div class="ell" style="font-size:12px;color:var(--mut2)">${rawCash()[name] == null ? esc(cashExplain(name)) : 'montant que tu as fixé'}</div></div>
      <div style="text-align:right;flex:none"><div class="mono" style="font-size:14px;font-weight:500">${mEur(e.cash)}</div><div style="font-size:12px;font-weight:600;margin-top:2px;color:var(--blue)">Modifier</div></div>
    </div>` : '';

  return `
    <div class="chips">${chips}</div>

    <div class="card">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="ava" style="width:40px;height:40px;font-size:13px">${esc(abbr(name))}</div>
        <div class="grow"><div class="ell" style="font-size:16px;font-weight:600">${esc(name)}</div><div class="ell" style="font-size:12px;color:var(--mut2)">${garanti ? 'Épargne disponible · solde saisi' : `${e.lines.length} ligne${e.lines.length > 1 ? 's' : ''} · ${snap?.live ? 'cotations en direct' : 'derniers cours connus'}`}</div></div>
      </div>
      <div class="mono" style="font-size:30px;font-weight:500;letter-spacing:-1px;margin-top:16px">${mEur(e.value)}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
        <span class="badge ${garanti ? 'flat' : (e.pv >= 0 ? '' : 'down')}">${garanti ? 'Capital garanti' : (e.pv >= 0 ? '▲ ' : '▼ ') + sPct(e.pvPct).replace('+','')}</span>
        ${garanti ? '' : `<span class="mono ${kls(e.pv)}" style="font-size:13px;font-weight:500">${mSEur(e.pv)}</span>`}
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line2)">
        ${stats.map(s => `<div class="row"><span style="font-size:13px;color:var(--mut)">${esc(s[0])}</span><span class="mono ${s[2] === 1 ? 'pos' : (s[2] === -1 ? 'neg' : '')}" style="font-size:13px;font-weight:500;text-align:right">${esc(s[1])}</span></div>`).join('')}
      </div>
      ${gauge ? `
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line2)">
        <div class="row" style="margin-bottom:8px"><span style="font-size:12px;color:var(--mut2)">${gauge.label}</span><span class="mono" style="font-size:12px;font-weight:500;color:var(--mut)">${state.hide ? HIDDEN : gauge.value}</span></div>
        <div class="track"><div class="fill" style="width:${Math.max(1, Math.min(100, gauge.pct)).toFixed(1)}%"></div></div>
      </div>` : ''}
      ${garanti ? `<button class="btn-p" style="margin-top:16px" data-act="editBalance" data-arg="${esc(name)}">Mettre à jour le solde</button>` : ''}
    </div>

    ${garanti ? '' : `
    <div class="card">
      <div class="row" style="align-items:baseline">
        <div class="card-t">Lignes</div>
        <span class="link" data-act="addTo" data-arg="${esc(name)}">+ Ajouter</span>
      </div>
      <div style="display:flex;flex-direction:column;margin-top:8px">
        ${(lines + cash) || '<div class="empty">Aucune ligne.</div>'}
      </div>
      ${e.lines.length ? '<div class="hint">Touche une ligne pour la modifier ou la supprimer</div>' : ''}
    </div>`}`;
}

function divFor(compteName){
  const y = String(new Date().getFullYear());
  return (snap?.operations || [])
    .filter(o => o.compte === compteName && o.type === 'Dividende' && o.date.startsWith(y))
    .reduce((s,o) => s + Math.abs(o.montant), 0);
}

/* ============================================================
   Écran Portefeuille — mode Répartition (calculée sur tes lignes)
   ============================================================ */
const REP_TABS = [['titre','Lignes'],['classe','Classes'],['env','Enveloppes'],['pays','Pays']];

function allocRows(){
  const a = snap?.allocation || { titre:[], classe:[], pays:[], parEnveloppe:[] };
  if (state.scope === 'Tout') {
    if (state.tab === 'classe') return a.classe;
    if (state.tab === 'env') return a.parEnveloppe;
    if (state.tab === 'pays') return a.pays || [];
    return a.titre;
  }
  const c = compte(state.scope);
  const lines = c.lines.map(l => [l.name, l.value, l.classe, window.PatrimoineCore.paysOf(l)]);
  if (c.cash) lines.push(['Liquidités', c.cash, 'Liquidités', 'Liquidités']);
  if (c.balance) lines.push([c.name, c.balance, 'Épargne garantie', 'Épargne garantie']);
  const group = col => {
    const by = {};
    for (const r of lines) by[r[col]] = (by[r[col]] || 0) + r[1];
    return Object.entries(by).map(([k, v]) => [k, Math.round(v*100)/100]).filter(r => r[1] > 0).sort((x,y) => y[1] - x[1]);
  };
  if (state.tab === 'classe') return group(2);
  if (state.tab === 'pays') return group(3);
  return lines.map(r => [r[0], r[1]]).filter(r => r[1] > 0).sort((x,y) => y[1] - x[1]);
}

function repNote(rows, total){
  if (!rows.length) return '';
  if (state.tab === 'pays') return 'Pays déduit du code ISIN : pays de la société pour une action, pays de domiciliation pour un fonds (sa composition réelle n\'est pas connue).';
  const pc = rows[0][1] / total * 100;
  const warn = state.tab === 'titre' && rows.length > 1 && pc > 25 ? ' Forte concentration sur un seul actif.' : '';
  return `« ${esc(rows[0][0])} » pèse ${pctS(pc)} du total.${warn}`;
}

function modeRepartition(){
  const scopes = ['Tout', ...comptes().filter(n => compte(n).value > 0)];
  if (!scopes.includes(state.scope)) state.scope = 'Tout';
  if (state.scope !== 'Tout' && state.tab === 'env') state.tab = 'titre';
  const rows = allocRows();
  const total = rows.reduce((s,r) => s + r[1], 0) || 1;
  const sh = state.seg != null && state.seg < rows.length ? state.seg : null;

  const segbar = `<div class="chips">${scopes.map(s =>
    `<div class="chip${state.scope === s ? ' on' : ''}" data-act="scope" data-arg="${esc(s)}">${esc(s)}</div>`).join('')}</div>`;
  const tabs = `<div class="segbar">${REP_TABS.filter(([v]) => !(v === 'env' && state.scope !== 'Tout'))
    .map(([v,l]) => `<div class="seg${state.tab === v ? ' on' : ''}" data-act="tab" data-arg="${v}">${l}</div>`).join('')}</div>`;

  let cum = 0;
  const segs = rows.map((r,i) => {
    const pc = r[1] / total * 100, start = cum; cum += pc;
    const active = sh === i;
    return { i, color:PAL[i % PAL.length], w: active ? 6.8 : 5.4,
      dash: Math.max(0.1, pc - 0.5).toFixed(2) + ' ' + (100 - pc + 0.5).toFixed(2),
      off:(25 - start).toFixed(2), label:r[0], pct:pctS(Math.round(pc*10)/10), amount:mEur0(r[1]), active };
  });

  if (!rows.length) return `${segbar}${tabs}<div class="card"><div class="empty">Aucune ligne à répartir pour l'instant.</div></div>`;

  return `${segbar}${tabs}
    <div class="card">
      <div style="position:relative;width:200px;height:200px;margin:4px auto 0">
        <svg width="200" height="200" viewBox="0 0 42 42" style="display:block">
          <circle cx="21" cy="21" r="15.9" fill="none" stroke="#f2f3f5" stroke-width="5.4"></circle>
          ${segs.map(s => `<circle cx="21" cy="21" r="15.9" fill="none" stroke="${s.color}" stroke-width="${s.w}" stroke-dasharray="${s.dash}" stroke-dashoffset="${s.off}" data-act="seg" data-arg="${s.i}" style="cursor:pointer"></circle>`).join('')}
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:0 30px;text-align:center">
          <div class="mono" style="font-size:26px;font-weight:500;letter-spacing:-.7px">${sh === null ? '100 %' : segs[sh].pct}</div>
          <div style="font-size:12px;color:var(--mut);margin-top:2px;line-height:1.25">${sh === null ? (state.scope === 'Tout' ? 'du patrimoine' : "de l'enveloppe") : esc(segs[sh].label)}</div>
          <div class="mono" style="font-size:12px;margin-top:5px">${sh === null ? mEur0(total) : segs[sh].amount}</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;margin-top:14px">
        ${segs.map(s => `
          <div data-act="seg" data-arg="${s.i}" style="display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:12px;cursor:pointer;background:${s.active ? 'var(--bg)' : 'transparent'}">
            <span style="width:10px;height:10px;border-radius:3px;background:${s.color};display:inline-block;flex:none"></span>
            <span class="ell" style="font-size:14px;font-weight:500;flex:1;min-width:0">${esc(s.label)}</span>
            <span class="mono" style="font-size:13px;font-weight:600;flex:none">${s.pct}</span>
            <span class="mono" style="font-size:12px;color:var(--mut2);width:74px;text-align:right;flex:none">${s.amount}</span>
          </div>`).join('')}
      </div>
      <div class="note">${repNote(rows, total)}</div>
    </div>`;
}

function screenPortefeuille(){
  return `<div class="screen">
    <div class="segbar">
      <div class="seg${state.mode === 'env' ? ' on' : ''}" data-act="mode" data-arg="env">Enveloppes</div>
      <div class="seg${state.mode === 'rep' ? ' on' : ''}" data-act="mode" data-arg="rep">Répartition</div>
    </div>

  const r = state.report;
  if (!r) return '';
  const offlineNote = r.pending ? ' · enregistré sur ce téléphone, synchronisé au retour du réseau' : '';
  if (r.error) return `<div class="report err" role="alert"><strong>${esc(r.title || 'Enregistrement impossible')}.</strong><br>${esc(r.error)}</div>`;
  if (r.message) return `<div class="report ok" role="status">${esc(r.message)}${offlineNote}.</div>`;
  const d = r.report;
  const detail = d.kind === 'operations'
    ? `${d.added} opération(s) ajoutée(s)${d.duplicates ? `, ${d.duplicates} doublon(s) ignoré(s)` : ''}`
    : `${d.added} ligne(s) ajoutée(s), ${d.updated} mise(s) à jour${d.removed ? `, ${d.removed} soldée(s)` : ''}`;
  return `<div class="report ok" role="status"><strong>${esc(d.file)} importé.</strong><br>${detail}${d.skipped ? ` · ${d.skipped} ligne(s) ignorée(s)` : ''}${offlineNote}.</div>`;

/* ============================================================
   Rendu + interactions
   ============================================================ */
const SCREENS = { accueil:screenAccueil, portefeuille:screenPortefeuille, ops:screenOps };
const app = document.getElementById('app');
const picker = document.getElementById('picker');

/* Les valeurs saisies survivent aux rafraîchissements de l'écran (cotation
   qui arrive pendant la saisie…). `formEpoch` change quand le formulaire doit
   repartir de zéro. */
let formEpoch = 0;
function captureInputs(){
  // époque du formulaire AFFICHÉ : si elle a changé depuis, la saisie ne doit pas revenir
  const shown = app.querySelector('form[data-epoch]');
  const kept = { epoch: shown ? Number(shown.dataset.epoch) : formEpoch, vals:{}, focus:null };
  app.querySelectorAll('form input[id]').forEach(el => { kept.vals[el.id] = el.value; });
  const a = document.activeElement;
  if (a?.id && app.contains(a)) kept.focus = { id:a.id, s:a.selectionStart, e:a.selectionEnd };
  return kept;
}
function restoreInputs(kept){
  if (kept.epoch !== formEpoch) return;
  for (const [id, v] of Object.entries(kept.vals)) {
    const el = document.getElementById(id);
    if (el && app.contains(el) && el.value !== v) el.value = v;
  }
  if (kept.focus) {
    const el = document.getElementById(kept.focus.id);
    if (el && app.contains(el)) {
      el.focus({ preventScroll:true });
      try { if (kept.focus.s != null) el.setSelectionRange(kept.focus.s, kept.focus.e); } catch { /* type date */ }
    }
  }
}

function render(){
  if (state.user === undefined){ UI.loading(app); return; }
  if (state.user === null){
    if (!app.querySelector('.pk-auth')) UI.mountAuth(app);
    return;
  }
  if (!snap){
    app.innerHTML = `<div class="auth-shell"><div class="card auth-card">${
      dataError
        ? `<div class="card-t">Connexion aux données impossible</div><div style="font-size:13px;color:var(--mut);margin-top:6px;line-height:1.5">${esc(dataError)}</div>
           <button class="btn-p" style="margin-top:16px" data-act="retryData">Réessayer</button>
           <button class="btn-s" style="margin-top:10px" data-act="signOut">Se déconnecter</button>`
        : `<div class="empty"><span class="spin"></span>Chargement du portefeuille…</div>`
    }</div></div>`;
    return;
  }
  const scroll = app.querySelector('main')?.scrollTop || 0;
  const sheetScroll = app.querySelector('.sheet')?.scrollTop || 0;
  const kept = captureInputs();
  app.innerHTML = header()
    + (dataError ? `<div class="report err" style="margin:10px 16px 0">${esc(dataError)} <span class="link" data-act="retryData">Réessayer</span></div>` : '')
    + `<main>${SCREENS[state.screen]()}</main>` + nav() + sheet();
  const m = app.querySelector('main');
  if (m) m.scrollTop = scroll;
  const sh = app.querySelector('.sheet');
  if (sh) sh.scrollTop = sheetScroll;
  restoreInputs(kept);
  wirePositionForm();

  app.querySelectorAll('[data-drop]').forEach(el => {
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('over');
      const f = e.dataTransfer?.files?.[0];
      if (f) upload(f);
    });
  });
}

function wirePositionForm(){
  const form = app.querySelector('#posForm');
  if (!form) return;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (state.importing) return;
    const v = id => app.querySelector('#' + id)?.value ?? '';
    const num = window.PatrimoineCore.num;
    const ed = state.editing;
    const compte = ed?.compte || state.formCompte || 'PEA';
    const solde = isSoldeCompte(compte);
    const saisie = solde
      ? { montant: num(v('pSolde')), taux: v('pTaux').trim() === '' ? null : num(v('pTaux')) }
      : { nameOrIsin: v('pName').trim(), qty: num(v('pQty')), pru: num(v('pPru')), date: v('pDate') };
    // identifiant inchangé lors d'une modification : on garde nom, ISIN et ticker
    // d'origine (sinon l'ISIN, qui sert à la cotation, serait perdu)
    if (!solde && ed && [ed.name, ed.isin, ed.ticker].includes(saisie.nameOrIsin)) {
      Object.assign(saisie, { name: ed.name, isin: ed.isin || '', ticker: ed.ticker || '' });
    }

    const fail = (msg, id) => { state.report = { error:msg, title:'Vérifie ta saisie' }; render(); app.querySelector('#' + id)?.focus(); };
    if (solde) {
      if (saisie.montant == null || saisie.montant < 0) return fail('Indique le solde en euros (ex. 6 681,68).', 'pSolde');
      if (v('pTaux').trim() !== '' && (saisie.taux == null || saisie.taux < 0 || saisie.taux > 20)) return fail('Taux invalide : entre 0 et 20 (ex. 2,4).', 'pTaux');
    } else {
      if (!saisie.nameOrIsin) return fail('Indique le nom ou le code ISIN de la ligne.', 'pName');
      if (saisie.qty == null || saisie.qty <= 0) return fail('Indique une quantité supérieure à 0 (ex. 4 ou 0,5).', 'pQty');
      if (saisie.pru == null || saisie.pru < 0) return fail('Indique le prix d\'achat unitaire (ex. 168,40).', 'pPru');
    }

    set({ importing:true, report:null });
    try {
      if (solde) {
        await window.PatrimoineData.updateBalance(compte, saisie.montant, saisie.taux);
        state.report = { message:`Solde de ${compte} enregistré` };
      } else {
        const res = await window.PatrimoineData.savePosition({ ...saisie, compte, replaces: ed?.name });
        state.report = { message:`${res.name} ${res.created ? 'ajoutée' : 'mise à jour'}`, pending:res.pending };
      }
      if (ed) { state.editing = null; state.sheet = false; UI.toast(state.report.message, 'ok'); }
      formEpoch++;
    } catch (e2) {
      state.report = { error:e2.message };
    } finally {
      set({ importing:false });
      render();
    }
  });
}

async function upload(file){
  set({ importing:true, report:null, sheet:true, sheetTab:'fichier' });
  try {
    state.report = await window.PatrimoineData.importFile(file);
    UI.toast(`${file.name} importé`, 'ok');
  } catch (e) {
    state.report = { error:e.message, title:'Import refusé' };
  } finally {
    set({ importing:false });
    render();
  }
}

picker.addEventListener('change', () => {
  const f = picker.files?.[0];
  picker.value = '';
  if (f) upload(f);
});

const parseAmount = (raw, { allowEmpty = false } = {}) => {
  if (allowEmpty && String(raw).trim() === '') return null;
  const n = window.PatrimoineCore.num(raw);
  if (n == null || n < 0 || n > 1e10) throw new Error('Montant invalide : indique un nombre positif (ex. 1 250,50).');
  return n;
};
const frNum = n => n == null ? '' : String(n).replace('.', ',');

const ACTIONS = {
  screen: v => set({ screen:v, seg:null, hov:null }),
  mode:   v => set({ mode:v, seg:null }),
  env:    v => set({ screen:'portefeuille', mode:'env', env:v }),
  scope:  v => set({ scope:v, seg:null }),
  tab:    v => set({ tab:v, seg:null }),

  seg:    v => set({ seg: state.seg === Number(v) ? null : Number(v) }),
  hov:    v => set({ hov:Number(v) }),
  sheet:  v => { formEpoch++; set({ sheet:v === '1', report:null, editing:null }); },
  sheetFile: () => { formEpoch++; set({ sheet:true, sheetTab:'fichier', report:null, editing:null }); },
  sheetTab: v => set({ sheetTab:v, report:null }),
  addTo:  name => { formEpoch++; set({ sheet:true, sheetTab:'saisie', formCompte:name, editing:null, report:null }); },
  formCompte: v => { formEpoch++; set({ formCompte:v, report:null }); },
  newCompte: async () => {
    const r = await UI.dialog({
      title:'Nouvelle enveloppe', message:'Nom de l\'enveloppe (ex. CTO, PER, PEA-PME, Livret Jeune…).',
      fields:[{ name:'nom', label:'Nom', placeholder:'ex. CTO' }], confirmLabel:'Utiliser',
      validate: v => v.nom.trim() ? null : 'Indique un nom.'
    });
    if (r) { formEpoch++; set({ formCompte: window.PatrimoineCore.normCompte(r.nom.trim()), report:null }); }
  },
  cancelEdit: () => { formEpoch++; set({ editing:null, sheet:false, report:null }); },
  pick:   () => picker.click(),
  retryData: () => { dataError = null; render(); window.PatrimoineData.retry(); },
  stop:   () => {},
  hide:   () => { writePref('hideAmounts', state.hide ? '0' : '1'); set({ hide: !state.hide }); },
  editLine: arg => {
    const line = (snap?.lines || [])[Number(arg)];
    if (!line) return;
    const buys = (snap?.operations || []).filter(o => o.compte === line.compte && o.type === 'Achat' &&
      (o.libelle === line.name || (o.ticker && o.ticker === line.ticker) || (o.isin && o.isin === line.isin)));
    const buyDate = buys.reduce((min, o) => (!min || o.date < min) ? o.date : min, '');
    formEpoch++;
    set({ editing:{ ...line, buyDate }, formCompte:line.compte, sheet:true, sheetTab:'saisie', report:null });
  },
  delEditing: async () => {
    const ed = state.editing;
    if (!ed) return;
    const nOps = window.PatrimoineData.countPositionOperations(ed.name, ed.compte);
    const ok = await UI.confirm(`Supprimer « ${ed.name} » ?`,
      nOps ? `Ses ${nOps} opération(s) d'achat/vente seront supprimées aussi, sinon la ligne réapparaîtrait. Versements et dividendes sont conservés.` : `La ligne est retirée de ${ed.compte}.`,
      { confirmLabel:'Supprimer', danger:true, onConfirm: () => window.PatrimoineData.removePosition(ed.name, ed.compte) });
    if (ok) { formEpoch++; UI.toast(`« ${ed.name} » supprimée`, 'ok'); set({ editing:null, sheet:false, report:null }); }
  },
  editCash: compteName => {
    const cur = snap?.comptes?.[compteName]?.cash ?? 0;
    const derive = rawCash()[compteName] == null;
    return UI.dialog({
      title:`Liquidités · ${compteName}`,
      message: derive ? `Calculées à partir de tes opérations : ${cashExplain(compteName)}.\nSi ce n'est pas ton solde réel, indique le bon montant.` : 'Montant que tu as fixé. Laisse vide pour revenir au calcul automatique.',
      fields:[{ name:'v', label:'Liquidités (€)', value:frNum(cur), inputmode:'decimal', hint:'Mets 0 si tu n\'as pas d\'espèces sur cette enveloppe.' }],
      confirmLabel:'Enregistrer',
      onConfirm: async ({ v }) => {
        if (!derive && String(v).trim() === '') await window.PatrimoineData.clearCash(compteName);
        else await window.PatrimoineData.setCash(compteName, parseAmount(v));
        UI.toast('Liquidités mises à jour', 'ok');
      }
    });
  },
  editBalance: compteName => {
    const c = snap?.comptes?.[compteName];
    return UI.dialog({
      title:`Solde · ${compteName}`,
      fields:[
        { name:'solde', label:'Solde actuel (€)', value:frNum(c?.balance ?? ''), inputmode:'decimal', placeholder:'ex. 6 681,68' },
        { name:'taux', label:'Taux annuel (%) — facultatif', value:frNum(c?.taux ?? ''), inputmode:'decimal', placeholder:'ex. 2,4' }
      ],
      confirmLabel:'Enregistrer',
      onConfirm: async ({ solde, taux }) => {
        const t = String(taux).trim() === '' ? null : window.PatrimoineCore.num(taux);
        if (String(taux).trim() !== '' && (t == null || t < 0 || t > 20)) throw new Error('Taux invalide : entre 0 et 20 %.');
        await window.PatrimoineData.updateBalance(compteName, parseAmount(solde), t);
        UI.toast(`Solde de ${compteName} enregistré`, 'ok');
      }
    });
  },
  opMenu: async arg => {
    const op = (snap?.operations || []).find(o => o.idx === Number(arg));
    if (!op) return;
    await UI.confirm('Supprimer cette opération ?',
      `${op.dateFr} · ${op.compte} · ${op.type}\n${op.libelle} · ${sEur(opAmount(op))}\n\nLes montants qui en découlent seront recalculés.`,
      { confirmLabel:'Supprimer', danger:true, onConfirm: () => window.PatrimoineData.removeOperation(op) });
  },
  addOp: () => {
    const list = [...new Set([...comptes(), ...BASE_COMPTES])];
    const today = new Date().toISOString().slice(0,10);
    return UI.dialog({
      title:'Ajouter une opération',
      message:'Le sens (entrée ou sortie) est déduit du type : saisis le montant en positif.',
      fields:[
        { name:'date', label:'Date', type:'date', value:today, max:today },
        { name:'compte', label:'Enveloppe', options:list, value:state.filt !== 'Tous' ? state.filt : list[0] },
        { name:'type', label:'Type', options:OP_TYPES, value:'Versement' },
        { name:'libelle', label:'Libellé (facultatif)', placeholder:'ex. Virement mensuel' },
        { name:'montant', label:'Montant (€)', inputmode:'decimal', placeholder:'ex. 200' }
      ],
      confirmLabel:'Ajouter',
      onConfirm: async v => {
        const m = parseAmount(v.montant);
        if (!m) throw new Error('Le montant doit être supérieur à 0.');
        await window.PatrimoineData.addOperation({ ...v, montant:m });
        UI.toast('Opération ajoutée', 'ok');
      }
    });
  },
  editExpenses: () => UI.dialog({
    title:'Dépenses mensuelles',
    message:'Tes dépenses courantes par mois, pour savoir combien de mois ton épargne de précaution couvre. Laisse vide pour retirer le calcul.',
    fields:[{ name:'v', label:'Dépenses par mois (€)', value:frNum(depensesMensuelles()), inputmode:'decimal', placeholder:'ex. 1 500' }],
    confirmLabel:'Enregistrer',
    onConfirm: async ({ v }) => { await window.PatrimoineData.saveSettings({ monthlyExpenses: parseAmount(v, { allowEmpty:true }) }); }
  }),
  signOut: () => { UI.loading(app, 'Déconnexion…'); return window.PatrimoineAuth.signOut(); }
};

app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !app.contains(t)) return;
  const fn = ACTIONS[t.dataset.act];
  if (fn) { e.stopPropagation(); UI.run(fn, t.dataset.arg); }
});

// bouton retour Android / Échap : ferme la feuille au lieu de quitter l'app
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.sheet && !document.querySelector('.pk-overlay')) { formEpoch++; set({ sheet:false, editing:null }); }
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.user && snap) window.PatrimoineData.refreshPerf(true, false).catch(() => {});
});
window.addEventListener('online', () => render());
window.addEventListener('offline', () => render());

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/m/sw.js').catch(() => {});

render();
UI.whenReady(app, boot);
</script>
</body>
</html>
