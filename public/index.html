<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrimoine &amp; Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

     Sans lui, un navigateur ayant déjà mis un module en cache continue de servir
     l'ancienne version jusqu'à expiration, et l'app paraît « ne pas se mettre à jour ». -->

<style>
:root{
  --blue:#0052ff; --blue-d:#003ecc; --blue-l:#4d84ff;
  --green:#05b169; --red:#cf202f; --amber:#b7791f;
  --ink:#0a0b0d; --mut:#5b616e; --mut2:#7c828a; --mut3:#a8acb3;
  --line:#dee1e6; --line2:#eef0f3; --line3:#f2f3f5;
  --bg:#f7f7f7; --white:#fff; --dark:#16181c; --dark-line:#2a2f37;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{color:var(--blue-d)}

/* Pas de min-width : la maquette d'origine imposait 1280px, ce qui coupait
   le contenu à droite dès que la fenêtre était plus étroite. */
.shell{display:flex;min-height:100vh;align-items:stretch;width:100%}
html,body{max-width:100%;overflow-x:hidden}

/* ---------- sidebar ---------- */
.side{width:244px;flex:none;background:var(--white);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:28px;height:28px;border-radius:9999px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.brand-name{font-size:16px;font-weight:600;letter-spacing:-.2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut3);padding:0 8px 8px}
.nav-label+.nav-label,.nav-item+.nav-label{padding-top:16px}
.nav-item{position:relative;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.nav-item:hover{background:var(--bg)}
.nav-item.on{background:var(--line2)}
.nav-item.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--blue)}
.nav-item.on.root::before{display:none}
.nav-item span{position:relative;font-size:14px;font-weight:500}
.nav-item .amt{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--mut2);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.sync{background:var(--bg);border-radius:16px;padding:16px}
.sync-t{font-size:12px;font-weight:600;margin-bottom:4px}
.sync-b{font-size:12px;line-height:1.5;color:var(--mut2)}
.link{font-size:13px;font-weight:600;color:var(--blue);cursor:pointer}
.user{display:flex;align-items:center;gap:10px;padding:4px 8px}
.avatar{width:32px;height:32px;border-radius:9999px;background:var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--mut)}

/* ---------- header ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--white);border-bottom:1px solid var(--line);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;position:sticky;top:0;z-index:20}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.4px;line-height:1.2;margin:0}
.top-sub{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:var(--mut2)}
.dot-g{width:6px;height:6px;border-radius:9999px;background:var(--green);display:inline-block}
.dot-g.pulse{animation:pulse 2s ease-in-out infinite}
.dot-g.warn{background:var(--amber)}
.dot-g.off{background:var(--mut3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.refresh{border:1px solid var(--line);background:var(--white);border-radius:100px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;font-family:inherit}
.refresh:hover{border-color:var(--mut3);color:var(--ink)}
.refresh[disabled]{opacity:.5;cursor:default}
.seg{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:100px;padding:4px}
.seg-item{position:relative;padding:8px 16px;border-radius:100px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.seg-item.sm{padding:7px 15px}
.seg-item.on{background:var(--white);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{height:44px;padding:0 20px;border-radius:100px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-d)}
.btn-s{background:var(--line2);color:var(--ink)}

/* ---------- layout ---------- */
.screen{padding:28px 32px 64px;display:flex;flex-direction:column;gap:20px;max-width:1360px;width:100%;min-width:0}
main{min-width:0}                       /* sans ça, un enfant large empêche le flex de rétrécir */
.grid{min-width:0}
.card{min-width:0}
.card{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:24px}
.card.lg{padding:28px 32px}
.card-t{font-size:18px;font-weight:600;letter-spacing:-.2px}
.card-s{font-size:13px;color:var(--mut2);margin-top:4px}
.kpi-l{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut2);min-height:2.4em}
/* les montants ne doivent jamais passer à la ligne (le « € » se retrouvait seul
   en dessous) : ils rétrécissent avec la largeur disponible à la place */
.kpi-v{font-family:var(--mono);font-weight:500;font-size:clamp(17px,1.55vw,26px);letter-spacing:-.6px;margin-top:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-v.xl{font-size:clamp(21px,2.1vw,34px);letter-spacing:-1px}
.kpi-n{font-size:13px;color:var(--mut);margin-top:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--green)}
.neg{color:var(--red)}
.muted{color:var(--mut2)}
.grid{display:grid;gap:16px}
.row-between{display:flex;align-items:baseline;justify-content:space-between;gap:24px}
.head-block{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px}
.crumb .up{font-weight:500;color:var(--mut);cursor:pointer}
.crumb .sep{color:var(--mut3)}
.crumb .cur{font-weight:600}
.title-xl{font-size:32px;font-weight:400;letter-spacing:-.8px}
.title-sub{font-size:14px;color:var(--mut);margin-top:4px}
.tag{background:var(--line2);border-radius:100px;padding:4px 10px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.live-dot{width:6px;height:6px;border-radius:9999px;display:inline-block;background:var(--green)}
.stale{color:var(--mut3)}

/* ---------- tables ---------- */
.th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut2)}
.th.r,.td.r{text-align:right}
.tr{align-items:center;border-bottom:1px solid var(--bg)}
.tr:hover{background:var(--bg)}
.thead{border-bottom:1px solid var(--line);padding-bottom:10px}
.thead.soft{border-bottom-color:var(--line2)}
.empty{padding:28px;text-align:center;color:var(--mut2);font-size:14px}

/* ---------- bars / misc ---------- */
.track{height:6px;border-radius:3px;background:var(--line2)}
.track .fill{height:100%;border-radius:3px;background:var(--blue)}
.split{display:flex;border-radius:4px;overflow:hidden;gap:2px}
.tabs{display:flex;gap:28px;margin-top:20px;border-bottom:1px solid var(--line)}
.tab{padding-bottom:12px;cursor:pointer;position:relative;font-size:14px;font-weight:600;color:var(--mut2)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.legend .swatch{width:14px;height:2px;display:inline-block}
.legend .sq{width:10px;height:10px;border-radius:2px;display:inline-block}
.seg-row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer;background:transparent}
.seg-row.on{background:var(--bg)}
.dropzone{border:2px dashed var(--line);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-align:center;transition:border-color .12s,background .12s}
.dropzone:hover,.dropzone.over{border-color:var(--blue);background:#f7f9ff}
.conn{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.conn:hover{border-color:var(--mut3)}
.enveloppe{cursor:pointer;display:flex;flex-direction:column;gap:16px}
.enveloppe:hover{box-shadow:0 4px 12px rgba(0,0,0,.04);border-color:var(--mut3)}
.tip{background:var(--dark);border-radius:12px;padding:14px 16px;min-width:236px;pointer-events:none;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.16)}
.tip-l{display:flex;justify-content:space-between;gap:24px;margin-top:6px;font-size:13px;color:var(--mut3)}
.tip-l .v{font-family:var(--mono);font-weight:500;color:#fff;white-space:nowrap}
.tip-h{font-size:12px;font-weight:600;color:var(--mut3);letter-spacing:.04em;text-transform:uppercase}
.panel-dark{background:var(--dark);border-radius:16px;padding:20px;display:flex;flex-direction:column}
.alert{background:#f7f9ff;border:1px solid #cfdcff;border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;margin-top:24px}
.alert .bang{width:22px;height:22px;border-radius:9999px;background:var(--blue);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.overlay{position:fixed;inset:0;background:rgba(10,11,13,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:32px}
.modal{background:var(--white);border-radius:24px;padding:32px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:20px;max-height:90vh;overflow:auto}
.close{width:32px;height:32px;border-radius:9999px;background:var(--line2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--mut)}
.code{background:var(--bg);border-radius:12px;padding:14px;font-family:var(--mono);font-size:12px;line-height:1.8;color:var(--mut)}
.report{border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.6}
.report.ok{background:#f0fdf6;border:1px solid #b9ecd2;color:#0a5c3a}
.report.err{background:#fff5f5;border:1px solid #f3c9cd;color:#8c1620}
.report.busy{background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--mut3);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;right:24px;bottom:24px;z-index:80;max-width:420px}

/* ---------- auth ---------- */
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:400px;background:var(--white);border:1px solid var(--line);border-radius:24px;padding:36px}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--mut)}
.field input{height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;color:var(--ink);background:var(--white)}
.field input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.auth-error{background:#fff5f5;border:1px solid #f3c9cd;color:#8c1620;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px;line-height:1.5}
.auth-alt{text-align:center;margin-top:18px;font-size:13px;color:var(--mut)}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--mut3);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-google{height:44px;border-radius:100px;background:var(--white);border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;width:100%;font-family:inherit}
.btn-google:hover{background:var(--bg)}

/* ============================================================
   Adaptation à la largeur de fenêtre
   Les grilles sont définies en style inline (héritage de la maquette) :
   ces règles les surchargent aux tailles où elles déborderaient.
   Les tableaux à colonnes fixes défilent horizontalement dans leur carte
   plutôt que d'être coupés par le bord de la page.
   ============================================================ */
.scroll-x{overflow-x:auto}
.thead,.tr{min-width:max-content}

@media (max-width:1480px){
  .screen .grid[style*="1.4fr 1fr 1fr 1fr 1fr"],
  .screen .grid[style*="repeat(5,1fr)"]{grid-template-columns:repeat(3,1fr)!important}
}
@media (max-width:1180px){
  .top{padding:16px 20px}
  .screen{padding:20px 20px 56px}
  .card.lg{padding:22px 20px}
  .screen .grid[style*="1.4fr 1fr 1fr 1fr 1fr"],
  .screen .grid[style*="repeat(5,1fr)"],
  .screen .grid[style*="repeat(4,1fr)"],
  .screen .grid[style*="repeat(3,1fr)"],
  .screen .grid[style*="1.5fr 1fr"],
  .screen .grid[style*="1.7fr 1fr"],
  .screen .grid[style*="1fr 1.25fr"],
  .screen .grid[style*="1.2fr 1fr 1fr"],
  .screen .grid[style*="1.2fr 1fr 1fr"]{grid-template-columns:repeat(2,1fr)!important}
  .screen .grid[style*="1fr 264px"]{grid-template-columns:1fr!important}
  .screen .grid[style*="260px 1fr"]{grid-template-columns:1fr!important;justify-items:center}
}
@media (max-width:900px){
  .side{width:200px;padding:20px 12px}
  /* [style] pour égaler la spécificité des règles ci-dessus, sinon elles gagnent */
  .screen .grid[style],.screen .grid{grid-template-columns:1fr!important}
  .top h1{font-size:19px}
  /* en-têtes de carte : titre au-dessus du sélecteur au lieu de côte à côte */
  .card .row-between{flex-wrap:wrap;gap:12px}
  .seg{flex-wrap:wrap}
}
@media (max-width:720px){
  /* en dessous, l'app mobile dédiée (/m/) est plus adaptée */
  .side{display:none}
}
</style>
</head>

const hist = () => (snap?.history || []);

const PERIOD_DAYS = { Mensuel:31, Trimestriel:92, Annuel:365 };
const PERIOD_LABEL = { Mensuel:'sur 1 mois', Trimestriel:'sur 3 mois', Annuel:'sur 1 an', Global:'depuis le début' };

/**
 * Fenêtre d'historique correspondant à la période choisie, et performance sur
 * cette fenêtre (variation de la plus-value latente entre le début et la fin).
 *
 * `enough` dit si l'historique couvre réellement la période demandée : sinon on
 * le signale à l'écran au lieu de faire passer un chiffre plus court pour le
 * chiffre demandé. L'historique se construit à raison d'un point par jour, donc
 * les périodes longues ne sont exploitables qu'après plusieurs semaines d'usage.
 */
function periodWindow(period = state.period){
  const h = hist();
  const t = T();
  if (h.length < 2) {
    return { points:h, gain:t.pv || 0, pct:t.pvPct || 0, enough:false, label:PERIOD_LABEL[period] || '', period, fallback:'global' };
  }
  const last = h[h.length - 1];

  if (period === 'Global'){
    const first = h[0];
    return {
      points:h, enough:true, period, label:PERIOD_LABEL.Global,
      gain:last.val - last.cap,
      pct:last.cap ? (last.val - last.cap) / last.cap * 100 : 0,
      from:first.date, to:last.date
    };
  }

  const days = PERIOD_DAYS[period] || 365;
  const cutoffMs = Date.parse(last.date) - days * 86400000;
  const cutoff = new Date(cutoffMs).toISOString().slice(0,10);
  const points = h.filter(p => p.date >= cutoff);
  const base = h.filter(p => p.date <= cutoff).pop() || h[0];
  const window = points.length >= 2 ? points : h.slice(-2);
  const gain = (last.val - last.cap) - (base.val - base.cap);

  return {
    points:window, period, label:PERIOD_LABEL[period],
    gain, pct:last.cap ? gain / last.cap * 100 : 0,
    // historique suffisant seulement si un point antérieur au début de fenêtre existe
    enough: Date.parse(h[0].date) <= cutoffMs,
    from:window[0]?.date, to:last.date
  };
}

/** Compat : ancien appel [montant, pourcentage]. */
function perfPeriod(period){
  const w = periodWindow(period);
  return [sEur(w.gain), sPct(w.pct)];
}

/** Série d'un compte : historique réel si disponible, sinon droite début → aujourd'hui. */
function serieFor(name){
  const h = hist();
  const withCompte = h.filter(p => p.comptes && p.comptes[name]);
  if (withCompte.length >= 2) return withCompte.map(p => ({ date:p.date, cap:p.comptes[name].mise, val:p.comptes[name].value }));

  const c = compte(name);
  const ops = (snap?.operations || []).filter(o => o.compte === name);
  const first = ops.length ? ops[ops.length - 1].date : (h[0]?.date || null);
  if (!first) return [];
  return [{ date:first, cap:0, val:0 }, { date:h[h.length-1]?.date || first, cap:c.mise, val:c.value }];
}

/* ============================================================
   Graphe : série → chemins SVG
   ============================================================ */
function chart(points, W, H, pad = 12){
  if (points.length < 2) return null;
  const vals = points.flatMap(p => [p.val, p.cap]);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (max === min) { max += 1; min -= 1; }
  const span = max - min;
  min -= span * 0.12; max += span * 0.12;

  const x = i => i * W / (points.length - 1);
  const y = v => pad + (max - v) / (max - min) * (H - 2 * pad);

  const line = key => points.map((p,i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join(' ');
  const area = line('val') + ' ' + points.map((p,i) => `L${x(points.length-1-i).toFixed(1)},${y(points[points.length-1-i].cap).toFixed(1)}`).join(' ') + ' Z';

  return {
    valPath:line('val'), capPath:line('cap'), areaPath:area,
    x, y, points,
    lastX:x(points.length - 1), lastY:y(points[points.length - 1].val)
  };
}

function statusLine(){

  if (!snap) return { dot:'off', text:'Connexion…' };
  const age = conn.at ? Math.max(0, Math.round((Date.now() - conn.at) / 1000)) : null;
  const when = age == null ? '' : (age < 90 ? `il y a ${age} s` : `il y a ${Math.round(age/60)} min`);
  const failed = q?.failed?.length || 0;
  const total = (snap.lines || []).length;
  if (failed) return { dot:'warn', text:`${total - failed}/${total} cotations à jour · ${failed} en repli sur le dernier cours connu · ${when}` };
  return { dot:'pulse', text:`Cotations ${esc(q?.provider || 'live')} · ${total} lignes à jour ${when}` };
}

/* ---------- dividendes : réel (API) + estimations (statique) ---------- */
function divTotalRealized(){
  const d = snap?.dividends || {};
  return Object.values(d).reduce((s, y) => s + (y.total || 0), 0);
}

function divModel(year){
  const est = DIV_EST[year] || { months:Array(12).fill(0), lines:Array.from({length:12},()=>[]), max:1, top:[], estime:'—', yieldS:'—', next:'—', compare:'', summary:'' };
  const real = snap?.dividends?.[year];
  const months = est.months.slice();
  const lines = est.lines.map(l => l.slice());
  let lastPaid = -1;

  if (real){
    real.months.forEach((v,i) => {
      if (v > 0){ months[i] = v; lines[i] = real.lines[i]; lastPaid = Math.max(lastPaid, i); }
    });
  }
  const percu = real ? real.total : 0;
  const capital = T().capital || 0;
  return {
    months, lines, lastPaid, max: Math.max(est.max, ...months),
    percu: sEur(percu).replace('+',''),
    estime: est.estime, yieldS: est.yieldS, next: est.next,
    compare: est.compare, summary: est.summary, top: est.top
  };
}

function dividendCard(){
  const div = divModel(state.year);
  const dh = state.dHov;

  const bars = div.months.slice(0,12).map((val,i) => {
    const paid = i <= div.lastPaid && val > 0;
    const hgt = val === 0 ? 0 : Math.max(3, val / div.max * 100);
    const style = [
      'width:100%', `height:${hgt}%`, `min-height:${val === 0 ? '2px' : '0px'}`,
      'border-radius:4px 4px 0 0',
      `background:${val === 0 ? 'var(--line)' : (paid ? 'var(--green)' : '#ffffff')}`,
      `border:${val === 0 ? 'none' : (paid ? 'none' : '1.5px dashed #a8acb3')}`,
      `opacity:${(dh === null || dh === i) ? 1 : 0.4}`, 'transition:opacity .12s'
    ].join(';');
    return `<div data-hover="dHov" data-hval="${i}" style="height:100%;display:flex;align-items:flex-end;cursor:pointer"><div style="${style}"></div></div>`;
  }).join('');

  const tipMonth = dh === null ? 'Année ' + state.year : MLABEL[dh] + ' ' + state.year;
  const tipTotal = dh === null ? div.estime : eur(div.months[dh]);
  const tipStatus = dh === null ? div.summary
    : (dh <= div.lastPaid && div.months[dh] > 0 ? 'Versement encaissé'
    : (div.months[dh] === 0 ? 'Aucun versement attendu ce mois-ci' : 'Estimation sur la base des dividendes annoncés'));
  const tipLines = dh === null ? div.top
    : (div.lines[dh]?.length ? div.lines[dh].map(l => ({ name:l[0], amount: typeof l[1] === 'number' ? eur(l[1]) : l[1] })) : [{ name:'Aucun versement', amount:'—' }]);
  const cumul = dh === null ? div.percu : eur(div.months.slice(0, dh+1).reduce((a,b) => a+b, 0));

  return `
  <div class="card lg">
    <div class="head-block">
      <div>
        <div class="card-t">Dividendes, coupons &amp; intérêts</div>
        <div class="card-s">Versements encaissés issus des opérations importées · mois à venir estimés</div>
      </div>
      ${segControl([{value:'2026',label:'2026',small:true},{value:'2027',label:'2027 estimé',small:true}], String(state.year), 'year')}
    </div>
    <div style="display:flex;gap:40px;margin-top:20px">
      <div><div style="font-size:13px;color:var(--mut2)">Perçu à ce jour</div><div class="mono pos" style="font-size:24px;font-weight:500;margin-top:4px;white-space:nowrap">${div.percu}</div></div>
      <div><div style="font-size:13px;color:var(--mut2)">Estimé sur l'année</div><div class="mono" style="font-size:24px;font-weight:500;margin-top:4px;white-space:nowrap">${div.estime}</div></div>
      <div><div style="font-size:13px;color:var(--mut2)">Rendement sur capital</div><div class="mono" style="font-size:24px;font-weight:500;margin-top:4px;white-space:nowrap">${div.yieldS}</div></div>
      <div><div style="font-size:13px;color:var(--mut2)">Prochain versement</div><div style="font-size:15px;font-weight:600;margin-top:8px;white-space:nowrap">${div.next}</div></div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 264px;gap:24px;margin-top:24px;align-items:stretch">
      <div data-leave="dHov">
        <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:10px;align-items:end;height:190px;border-bottom:1px solid var(--line)">${bars}</div>
        <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:8px">
          ${['J','F','M','A','M','J','J','A','S','O','N','D'].map(m => `<span style="font-size:11px;color:var(--mut2);text-align:center">${m}</span>`).join('')}
        </div>
        <div style="display:flex;gap:24px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)">
          <div class="legend"><span class="sq" style="background:var(--green)"></span><span>Perçu</span></div>
          <div class="legend"><span class="sq" style="background:#fff;border:1.5px dashed var(--mut3)"></span><span>Estimé</span></div>
          <span style="font-size:13px;color:var(--mut2);margin-left:auto">${div.compare}</span>
        </div>
      </div>
      <div class="panel-dark">
        <div class="tip-h">${tipMonth}</div>
        <div class="mono" style="font-size:26px;font-weight:500;color:#fff;margin-top:8px;letter-spacing:-.5px;white-space:nowrap">${tipTotal}</div>
        <div style="font-size:12px;color:var(--mut3);margin-top:4px;line-height:1.45">${tipStatus}</div>
        <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
          ${tipLines.map(l => `<div style="display:flex;justify-content:space-between;gap:16px"><span style="font-size:13px;color:var(--mut3)">${esc(l.name)}</span><span class="mono" style="font-size:13px;font-weight:500;color:#fff;white-space:nowrap">${esc(l.amount)}</span></div>`).join('')}
        </div>
        <div style="margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--dark-line)">
          <span style="font-size:13px;color:var(--mut3)">${dh === null ? 'Perçu à ce jour' : 'Cumul depuis janvier'}</span>
          <span class="mono pos" style="font-size:13px;font-weight:600;white-space:nowrap">${cumul}</span>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- répartition ---------- */
function allocRows(){
  const a = snap?.allocation || { titre:[], classe:[] };
  if (state.tab === 'secteur') return SECTEURS[state.env] || [];
  if (state.env === 'Tout') return state.tab === 'classe' ? a.classe : a.titre;

  const c = compte(state.env);
  const lines = c.lines.map(l => [l.name, l.value, l.classe]);
  if (c.cash) lines.push(['Liquidités', c.cash, 'Liquidités']);
  if (state.tab === 'classe'){
    const by = {};
    for (const [, v, k] of lines) by[k] = (by[k] || 0) + v;
    return Object.entries(by).sort((x,y) => y[1] - x[1]).map(([k,v]) => [k, Math.round(v*100)/100]);
  }
  return lines.map(([n,v]) => [n, v]).sort((x,y) => y[1] - x[1]);
}

function allocationCard(){
  const rows = allocRows();
  const total = rows.reduce((s,r) => s + r[1], 0) || 1;
  const sh = state.seg;
  const meta = EXPO_META[state.env];

  let cum = 0;
  const segs = rows.map((r,i) => {
    const pc = r[1] / total * 100;
    const start = cum; cum += pc;
    return {
      i, color:PAL[i % PAL.length], w: sh === i ? 6.6 : 5.4,
      dash: Math.max(0.1, pc - 0.4).toFixed(2) + ' ' + (100 - pc + 0.4).toFixed(2),
      off: (25 - start).toFixed(2),
      label:r[0], pct:pctS(Math.round(pc*10)/10), amount:eur0(r[1]), pc, active: sh === i
    };
  });

  const tabs = [['titre','Par ligne'],['secteur','Par secteur'],['classe',"Par classe d'actifs"],['expo','Exposition réelle']]
    .map(([v,l]) => `<div class="tab${state.tab === v ? ' on' : ''}" data-act="tab" data-arg="${v}">${l}</div>`).join('');

  let body;
  if (state.tab !== 'expo'){
    const arcs = segs.map(s => `<circle cx="21" cy="21" r="15.9" fill="none" stroke="${s.color}" stroke-width="${s.w}" stroke-dasharray="${s.dash}" stroke-dashoffset="${s.off}" data-hover="seg" data-hval="${s.i}" style="cursor:pointer"></circle>`).join('');
    const list = segs.map(s => `
      <div class="seg-row${s.active ? ' on' : ''}" data-hover="seg" data-hval="${s.i}">
        <span class="sq" style="width:10px;height:10px;border-radius:2px;background:${s.color};display:inline-block;flex:none"></span>
        <span style="font-size:14px;font-weight:500;flex:1">${esc(s.label)}</span>
        <div style="width:120px;height:6px;border-radius:3px;background:var(--line3)"><div style="width:${Math.max(2,s.pc)}%;height:100%;border-radius:3px;background:${s.color}"></div></div>
        <span class="mono" style="font-size:14px;font-weight:500;width:64px;text-align:right;white-space:nowrap">${s.pct}</span>
        <span class="mono" style="font-size:14px;color:var(--mut);width:104px;text-align:right;white-space:nowrap">${s.amount}</span>
      </div>`).join('');

    body = `
      <div class="grid" style="grid-template-columns:260px 1fr;gap:40px;align-items:center;margin-top:28px">
        <div data-leave="seg" style="position:relative;width:236px;height:236px">
          <svg width="236" height="236" viewBox="0 0 42 42" style="display:block">
            <circle cx="21" cy="21" r="15.9" fill="none" stroke="#f2f3f5" stroke-width="5.4"></circle>
            ${arcs}
          </svg>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:0 34px;text-align:center">
            <div class="mono" style="font-size:30px;font-weight:500;letter-spacing:-.8px;white-space:nowrap">${sh === null ? pctS(100) : segs[sh].pct}</div>
            <div style="font-size:13px;color:var(--mut);margin-top:2px;line-height:1.3">${sh === null ? (state.tab === 'titre' ? 'du patrimoine' : state.tab === 'secteur' ? 'réparti par secteur' : 'réparti par classe') : esc(segs[sh].label)}</div>
            <div class="mono" style="font-size:13px;margin-top:6px;white-space:nowrap">${sh === null ? eur0(total) : segs[sh].amount}</div>
          </div>
        </div>
        <div data-leave="seg" style="display:flex;flex-direction:column;gap:2px">
          ${list || '<div class="empty">Aucune ligne — importe un relevé de positions.</div>'}
          <div style="font-size:13px;color:var(--mut2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)">${NOTES[state.env][state.tab === 'expo' ? 'titre' : state.tab]}</div>
        </div>
      </div>`;
  } else {
    const cols = '1.4fr 130px 130px 130px 96px';
    const base = compte(state.env === 'Tout' ? null : state.env);
    const denom = state.env === 'Tout' ? (T().patrimoine || 1) : (base.value || 1);
    const list = (EXPO[state.env] || []).map(r => {
      const tot = r[1] + r[2], pc = tot / denom * 100, dup = r[1] > 0 && r[2] > 0;
      return `
      <div class="tr" style="display:grid;grid-template-columns:${cols};padding:13px 0">
        <div>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:14px;font-weight:600">${esc(r[0])}</span>
            <span style="background:${dup ? '#fff0f1' : 'var(--line2)'};color:${dup ? 'var(--red)' : 'var(--mut)'};border-radius:100px;padding:3px 9px;font-size:11px;font-weight:600;letter-spacing:.03em;white-space:nowrap">${dup ? 'Doublon direct + ETF' : (r[1] > 0 ? 'En direct' : 'Via ETF uniquement')}</span>
          </div>
          <div style="display:flex;height:5px;border-radius:3px;overflow:hidden;gap:2px;width:190px;margin-top:7px">
            <div style="flex:${Math.max(r[1],0.5)};background:var(--ink)"></div><div style="flex:${Math.max(r[2],0.5)};background:var(--mut3)"></div>
          </div>
          <div style="font-size:12px;color:var(--mut2);margin-top:6px">${esc(r[3])}</div>
        </div>
        <span class="mono" style="font-size:14px;text-align:right;white-space:nowrap">${r[1] === 0 ? '—' : eur(r[1])}</span>
        <span class="mono" style="font-size:14px;text-align:right;color:var(--mut);white-space:nowrap">${r[2] === 0 ? '—' : '+' + eur(r[2])}</span>
        <span class="mono" style="font-size:14px;font-weight:600;text-align:right;white-space:nowrap">${eur(tot)}</span>
        <span class="mono" style="font-size:14px;font-weight:600;text-align:right;color:${pc >= 20 ? 'var(--red)' : 'var(--ink)'};white-space:nowrap">${pctS(Math.round(pc*10)/10)}</span>
      </div>`;
    }).join('');

    body = `
      <div class="alert">
        <div class="bang">!</div>
        <div>
          <div style="font-size:14px;font-weight:600">${esc(meta.title)}</div>
          <div style="font-size:13px;color:var(--mut);line-height:1.55;margin-top:3px">${esc(meta.body)}</div>
        </div>
      </div>
      <div class="scroll-x">
        <div class="thead" style="display:grid;grid-template-columns:${cols};padding:20px 0 10px;border-bottom:1px solid var(--line)">
          <span class="th">Sous-jacent</span><span class="th r">En direct</span><span class="th r">Via ETF / UC</span><span class="th r">Exposition réelle</span><span class="th r">% portef.</span>
        </div>
        ${list}
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:20px">
        <div style="border:1px solid var(--line);border-radius:16px;padding:18px 20px">
          <div style="font-size:13px;color:var(--mut2)">Chevauchement entre supports</div>
          <div class="mono" style="font-size:26px;font-weight:500;margin-top:6px">${meta.overlap}</div>
          <div style="font-size:13px;color:var(--mut);line-height:1.55;margin-top:6px">${esc(meta.overlapNote)}</div>
        </div>
        <div style="border:1px solid var(--line);border-radius:16px;padding:18px 20px">
          <div style="font-size:13px;color:var(--mut2)">Poids réel des 5 premières positions</div>
          <div class="mono" style="font-size:26px;font-weight:500;margin-top:6px">${meta.top5}</div>
          <div class="track" style="margin-top:10px"><div class="fill" style="width:${Math.min(100,meta.top5Bar)}%;background:${meta.top5Bar > 60 ? 'var(--red)' : 'var(--blue)'}"></div></div>
          <div style="font-size:13px;color:var(--mut);line-height:1.55;margin-top:8px">${esc(meta.top5Note)}</div>
        </div>
      </div>`;
  }

  return `
  <div class="card lg">
    <div class="head-block">
      <div>
        <div class="card-t">Répartition &amp; exposition</div>
        <div class="card-s">À quoi ton argent est réellement exposé, et dans quelle proportion</div>
      </div>
      ${segControl([
        {value:'Tout',label:'Tout',small:true},{value:'PEA',label:'PEA',small:true},{value:'Assurance Vie',label:'Assurance Vie',small:true}
      ], state.env, 'env')}
    </div>
    <div class="tabs">${tabs}</div>
    ${body}
  </div>`;
}

/* ---------- enveloppes ---------- */
function enveloppeCard(name, view, mono, sub, tagLabel, extra){
  const c = compte(name);
  const gain = Math.max(0.5, Math.abs(c.pv)), base = Math.max(0.5, c.mise);
  return `
  <div class="card enveloppe" data-act="view" data-arg="${view}">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="avatar" style="width:36px;height:36px;font-size:13px;color:var(--ink)">${mono}</div>
        <div><div style="font-size:16px;font-weight:600">${name}</div><div style="font-size:12px;color:var(--mut2)">${sub}</div></div>
      </div>
      <span class="tag">${tagLabel}</span>
    </div>
    <div>
      <div class="mono" style="font-size:28px;font-weight:500;letter-spacing:-.6px">${eur(c.value)}</div>
      <div style="display:flex;gap:14px;margin-top:6px;flex-wrap:wrap">
        <span style="font-size:13px;color:var(--mut)">${c.garanti ? 'Capital garanti' : 'Mise'} ${c.garanti ? '' : `<span class="mono" style="font-weight:500;color:var(--ink)">${eur(c.mise)}</span>`}</span>
        <span class="mono ${cls(c.pv)}" style="font-size:13px;font-weight:500">${c.garanti ? pctS((c.value / (T().patrimoine || 1)) * 100) + ' du patrimoine' : `${sEur(c.pv)} · ${sPct(c.pvPct)}`}</span>
      </div>
    </div>
    <div class="split" style="height:8px"><div style="flex:${base};background:var(--line2)"></div>${c.pv ? `<div style="flex:${gain};background:${c.pv >= 0 ? 'var(--green)' : 'var(--red)'}"></div>` : ''}</div>
    ${extra(c)}
  </div>`;
}

function enveloppeCards(){
  const perf = perfPeriod(state.period);
  const pea = compte('PEA'), av = compte('Assurance Vie'), la = compte('Livret A');
  const best = pea.lines[0], worst = pea.lines[pea.lines.length - 1];
  const uc = av.lines.filter(l => l.classe !== 'Fonds euro').reduce((s,l) => s + l.value, 0);
  const euro = av.value - uc;

  const plafond = (used, cap, label) => `
    <div style="border-top:1px solid var(--line2);padding-top:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:7px"><span style="font-size:12px;color:var(--mut2)">${label}</span><span class="mono" style="font-size:12px;font-weight:500;color:var(--mut)">${Math.round(used).toLocaleString('fr-FR')} / ${cap.toLocaleString('fr-FR')} €</span></div>
      <div class="track" style="background:var(--line2)"><div class="fill" style="width:${Math.min(100, used/cap*100).toFixed(1)}%"></div></div>
    </div>`;

  return `
  <div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px">
      <div class="card-t">Suivi par enveloppe fiscale</div>
      <span style="font-size:13px;color:var(--mut2)">Performance sur la période :
        <span class="mono ${cls(T().pv)}" style="font-weight:500">${perf[0]}</span>
        <span class="mono ${cls(T().pv)}" style="font-weight:500">${perf[1]}</span>
      </span>
    </div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr)">
      ${enveloppeCard('PEA','pea','PEA', `Bourse Direct · ${pea.lines.length} lignes`, 'Actions', c => `
        <div style="display:flex;flex-direction:column;gap:7px">
          <div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--mut)">Meilleure ligne</span><span style="font-size:13px;font-weight:500">${best ? esc(best.name) + ` <span class="mono ${cls(best.pct)}">${sPct(best.pct)}</span>` : '—'}</span></div>
          <div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--mut)">Moins bonne</span><span style="font-size:13px;font-weight:500">${worst && worst !== best ? esc(worst.name) + ` <span class="mono ${cls(worst.pct)}">${sPct(worst.pct)}</span>` : '—'}</span></div>
        </div>
        ${plafond(c.mise, 150000, 'Plafond de versement')}`)}

      ${enveloppeCard('Assurance Vie','av','AV', `Linxea Spirit 2 · ${av.lines.length} supports`, 'Mixte', c => `
        <div style="display:flex;flex-direction:column;gap:7px">
          <div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--mut)">Unités de compte</span><span style="font-size:13px;font-weight:500">${pctS(c.value ? uc/c.value*100 : 0)} · <span class="mono">${eur(uc)}</span></span></div>
          <div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--mut)">Fonds euro</span><span style="font-size:13px;font-weight:500">${pctS(c.value ? euro/c.value*100 : 0)} · <span class="mono">${eur(euro)}</span></span></div>
        </div>
        <div style="border-top:1px solid var(--line2);padding-top:14px">
          <div style="display:flex;justify-content:space-between;margin-bottom:7px"><span style="font-size:12px;color:var(--mut2)">Antériorité fiscale</span><span class="mono" style="font-size:12px;font-weight:500;color:var(--mut)">5 mois / 8 ans</span></div>
          <div class="track" style="background:var(--line2)"><div class="fill" style="width:5.2%"></div></div>
        </div>`)}

      ${enveloppeCard('Livret A','livret','LA','Épargne de précaution','Garanti', c => `
        <div style="display:flex;flex-direction:column;gap:7px">
          <div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--mut)">Intérêts ${new Date().getFullYear()} estimés</span><span class="mono pos" style="font-size:13px;font-weight:500">${c.interets ? sEur(c.interets) : '—'}</span></div>
          <div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--mut)">Taux en vigueur</span><span class="mono" style="font-size:13px;font-weight:500">${c.taux ? pctS(c.taux).replace('.',',') : '—'}</span></div>
        </div>
        ${plafond(c.value, 22950, 'Plafond réglementaire')}`)}
    </div>
  </div>`;
}

  const rows = ops.length ? ops.map((o,i) => `
    <div style="display:grid;grid-template-columns:${cols};align-items:center;padding:12px 0${i < ops.length-1 ? ';border-bottom:1px solid var(--bg)' : ''}">
      <span class="mono" style="font-size:13px;color:var(--mut)">${frDate(o.date)}</span>

/* projection : capitalisation mensuelle sur l'épargne moyenne observée */
function monthsToTarget(rate, target = 20000){
  const t = T();
  let v = t.patrimoine || 0;
  const m = t.epargneMoyenne || 0;
  const r = rate / 100 / 12;
  for (let i = 1; i <= 600; i++){
    v = v * (1 + r) + m;
    if (v >= target) return i;
  }
  return null;
}
function targetDate(rate){
  const n = monthsToTarget(rate);
  if (!n) return '> 50 ans';
  const d = new Date(); d.setMonth(d.getMonth() + n);
  return MSHORT[d.getMonth()] + ' ' + d.getFullYear();
}
function projectionText(){
  const t = T();
  return `À ${eur0(t.epargneMoyenne || 0)}/mois et 8 % de rendement, l'objectif est atteint en <span style="font-weight:600;color:var(--ink)">${targetDate(8)}</span>.`;
}
function projectionPaths(){
  const t = T();
  const series = [4, 8, 12].map(rate => {
    const pts = [];
    let v = t.patrimoine || 0;
    const r = rate / 100 / 12, m = t.epargneMoyenne || 0;
    for (let i = 0; i <= 60; i += 6){ pts.push(v); for (let k = 0; k < 6; k++) v = v * (1 + r) + m; }
    return { rate, pts };
  });
  const max = Math.max(20000, ...series.flatMap(s => s.pts));
  const path = s => s.pts.map((v,i) => `${i ? 'L' : 'M'}${(i / (s.pts.length-1) * 320).toFixed(1)},${(112 - v / max * 90).toFixed(1)}`).join(' ');
  return series.map(s => s.rate === 8
    ? `<path d="${path(s)}" fill="none" stroke="#0052ff" stroke-width="2"/>`
    : `<path d="${path(s)}" fill="none" stroke="#a8acb3" stroke-width="1.5" stroke-dasharray="4 3"/>`).join('');
}

function render(){
  if (state.user === undefined){
    app.innerHTML = `<div class="auth-shell"><div class="empty"><span class="spin"></span>Chargement…</div></div>`;
    return;
  }
  if (state.user === null){
    app.innerHTML = authScreen();
    wireAuthForm();
    return;
  }
  if (!snap){
    app.innerHTML = `<div class="auth-shell"><div class="card" style="max-width:420px">${
      dataError
        ? `<div class="card-t">Connexion aux données impossible</div><div class="card-s">${esc(dataError)}</div><div style="margin-top:16px"><div class="btn btn-p" style="display:inline-flex" data-act="retryData">Réessayer</div></div>`
        : `<div class="empty"><span class="spin"></span>Chargement du portefeuille…</div>`
    }</div></div>`;
    app.querySelector('[data-act="retryData"]')?.addEventListener('click', subscribeData);
    return;
  }
  app.innerHTML = `<div class="shell">${sidebar()}<main>${header()}${VIEWS[state.view]()}</main></div>${modal()}`;
  app.querySelectorAll('[data-leave]').forEach(el => el.addEventListener('mouseleave', () => set({ [el.dataset.leave]: null })));
  wirePositionForm();
  app.querySelectorAll('[data-drop]').forEach(el => {
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('over');
      const f = e.dataTransfer?.files?.[0];
      if (f) upload(f);
    });
  });
}

/* ---------- écran de connexion ---------- */
function authScreen(){
  const signup = state.authMode === 'signup';
  return `
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand"><div class="brand-mark">P</div><div class="brand-name" style="font-size:18px">Patrimoine</div></div>
      <div class="card-t" style="margin-bottom:4px">${signup ? 'Créer un compte' : 'Connexion'}</div>
      <div class="card-s" style="margin-bottom:20px">${signup ? 'Ton portefeuille te suit sur tous tes appareils.' : 'Retrouve ton portefeuille où que tu sois.'}</div>
      ${state.authError ? `<div class="auth-error">${esc(state.authError)}</div>` : ''}
      <form id="authForm">
        <div class="field"><label for="authEmail">E-mail</label><input id="authEmail" type="email" autocomplete="email" required></div>
        <div class="field"><label for="authPassword">Mot de passe</label><input id="authPassword" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" minlength="6" required></div>
        <button type="submit" class="btn btn-p" style="width:100%;justify-content:center" ${state.authBusy ? 'disabled' : ''}>
          ${state.authBusy ? '<span class="spin"></span>' : ''}${signup ? 'Créer mon compte' : 'Se connecter'}
        </button>
      </form>
      <div class="divider">ou</div>
      <button id="authGoogle" class="btn-google" type="button" ${state.authBusy ? 'disabled' : ''}>
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.79 2.73v2.27h2.9c1.7-1.56 2.68-3.87 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.27c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34C2.44 16.02 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.69A5.4 5.4 0 013.68 9c0-.59.1-1.16.27-1.69V4.97H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.03l2.99-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 1.98.96 4.97l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Continuer avec Google
      </button>
      <div class="auth-alt">
        ${signup ? 'Déjà un compte ?' : 'Pas encore de compte ?'}
        <span class="link" style="cursor:pointer" data-act="authToggle">${signup ? 'Se connecter' : "S'inscrire"}</span>
      </div>
      ${!signup ? `<div class="auth-alt"><span class="link" style="cursor:pointer" data-act="authForgot">Mot de passe oublié ?</span></div>` : ''}
    </div>
  </div>`;
}

function wireAuthForm(){
  app.querySelector('#authForm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const email = app.querySelector('#authEmail').value.trim();
    const password = app.querySelector('#authPassword').value;
    set({ authBusy:true, authError:null });
    try {
      if (state.authMode === 'signup') await window.PatrimoineAuth.signUp(email, password);
      else await window.PatrimoineAuth.signIn(email, password);
    } catch (e2) {
      state.authError = e2.message;
    } finally {
      set({ authBusy:false });
    }
  });
  app.querySelector('#authGoogle')?.addEventListener('click', async () => {
    set({ authBusy:true, authError:null });
    try { await window.PatrimoineAuth.signInGoogle(); }
    catch (e) { state.authError = e.message; }
    finally { set({ authBusy:false }); }
  });
}

/** Formulaire de saisie manuelle d'une ligne (action, ETF, obligation…). */
function wirePositionForm(){
  const form = app.querySelector('#posForm');
  if (!form) return;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const v = id => app.querySelector('#' + id)?.value ?? '';
    const num = window.PatrimoineCore.num;
    const ed = state.editing;
    const compte = ed?.compte || state.formCompte || 'PEA';
    const solde = isSoldeCompte(compte);

    // IMPORTANT : lire les champs AVANT tout set(), qui redessine la page et
    // remplace les <input> — sinon on relit des champs vides et la saisie de
    // l'utilisateur est perdue (« Montant invalide » sur un formulaire rempli).
    const saisie = solde
      ? { montant: num(v('pSolde')), taux: num(v('pTaux')) }
      : { nameOrIsin: v('pName'), qty: num(v('pQty')), pru: num(v('pPru')), date: v('pDate') };

    set({ importing:true, report:null });
    try {
      if (solde) {
        if (saisie.montant == null) throw new Error('Montant invalide.');
        await window.PatrimoineData.updateBalance(compte, saisie.montant, saisie.taux ?? undefined);
        state.report = { report:{ file:compte, kind:'positions', added:0, updated:1, removed:0, skipped:0 } };
      } else {
        const res = await window.PatrimoineData.savePosition({ ...saisie, compte, replaces: ed?.name });
        state.report = { report:{ file:res.name, kind:'positions', added:res.created ? 1 : 0, updated:res.created ? 0 : 1, removed:0, skipped:0 } };
      }
      state.editing = null;
    } catch (e2) {
      state.report = { error:e2.message };
    } finally {
      set({ importing:false });
      render();
    }
  });
}

async function upload(file){
  set({ importing:true, report:null });
  try {
    const res = await window.PatrimoineData.importFile(file);
    state.report = res;
  } catch (e) {
    state.report = { error:e.message };
  } finally {
    set({ importing:false });
    render();
  }
}

// Le fichier choisi est mis en attente : l'import ne part qu'au clic sur
// « Lancer l'import », pour que la sélection soit visible et confirmable.
picker.addEventListener('change', () => {
  const f = picker.files?.[0];
  picker.value = '';
  if (f) set({ pendingFile:f, report:null, modal:true, modalTab:'fichier' });
});

const ACTIONS = {
  view:   v => set({ view:v }),
  period: v => set({ period:v }),
  year:   v => set({ year:Number(v), dHov:null }),
  env:    v => set({ env:v, seg:null }),
  tab:    v => set({ tab:v, seg:null }),
  filt:   v => set({ filt:v }),
  modal:  v => set({ modal:v === '1', report:null }),
  modalTab: v => set({ modalTab:v, report:null }),
  pick:   () => picker.click(),
  runImport: async () => {
    const f = state.pendingFile;
    if (!f || state.importing) return;
    await upload(f);
    set({ pendingFile:null });
  },
  retryData: subscribeData,
  formCompte: v => set({ formCompte:v, editing:null }),
  cancelEdit: () => set({ editing:null }),
  editPos: arg => {
    const [name, compte] = String(arg).split('|');
    const line = (snap?.lines || []).find(l => l.name === name && l.compte === compte);
    if (!line) return;
    // date d'achat = première opération d'achat connue pour cette ligne
    const ops = (snap?.operations || []).filter(o => o.compte === compte && o.type === 'Achat' &&
      (o.libelle === name || (o.ticker && o.ticker === line.ticker) || (o.isin && o.isin === line.isin)));
    const buyDate = ops.length ? ops[ops.length - 1].date : '';
    set({ editing:{ ...line, buyDate }, formCompte:compte, modalTab:'saisie', modal:true, report:null });
  },
  delPos: async arg => {
    const [name, compte] = String(arg).split('|');
    const nOps = window.PatrimoineData.countPositionOperations?.(name, compte) || 0;
    const msg = nOps
      ? `Supprimer « ${name} » ?\n\nCette ligne provient de ${nOps} opération(s) d'achat/vente : elles seront supprimées aussi, sinon la ligne réapparaîtrait.`
      : `Supprimer la ligne « ${name} » ?`;
    if (!confirm(msg)) return;
    try { await window.PatrimoineData.removePosition(name, compte); state.report = null; state.editing = null; }
    catch (e) { state.report = { error:e.message }; }
    render();
  },
  stop:   () => {},
  signOut: () => window.PatrimoineAuth.signOut(),
  authToggle: () => set({ authMode: state.authMode === 'signup' ? 'signin' : 'signup', authError:null }),
  authForgot: async () => {
    const email = app.querySelector('#authEmail')?.value.trim();
    if (!email) { state.authError = 'Renseigne ton e-mail puis réessaie.'; render(); return; }
    try { await window.PatrimoineAuth.resetPassword(email); state.authError = 'E-mail de réinitialisation envoyé.'; }
    catch (e) { state.authError = e.message; }
    render();
  },
  refreshNow: async () => {
    conn = { ...conn, status:'connecting' }; render();
    try { await window.PatrimoineData.refreshPerf(true); }
    catch (e) { conn = { status:'offline', at:conn.at, error:e.message }; render(); }
  }
};

app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const fn = ACTIONS[t.dataset.act];
  if (fn) { e.stopPropagation(); fn(t.dataset.arg); }
});

app.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-hover]');
  if (!t) return;
  set({ [t.dataset.hover]: Number(t.dataset.hval) });
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.modal) set({ modal:false }); });

render();
whenFirebaseReady(boot);
</script>
