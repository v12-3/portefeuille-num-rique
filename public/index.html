<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrimoine &amp; Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- ?v= : numéro à incrémenter à chaque déploiement qui touche ces fichiers.
     Sans lui, un navigateur ayant déjà mis un module en cache continue de servir
     l'ancienne version jusqu'à expiration, et l'app paraît « ne pas se mettre à jour ». -->
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/m/icon-192.png">
<script src="/firebase-config.js?v=11"></script>
<script src="/app-core.js?v=11"></script>
<script src="/ui-kit.js?v=11"></script>
<script type="module" src="/firebase-client.js?v=11"></script>
<style>
:root{
  --blue:#0052ff; --blue-d:#003ecc; --blue-l:#4d84ff;
  --green:#05b169; --red:#cf202f; --amber:#b7791f;
  --ink:#0a0b0d; --mut:#5b616e; --mut2:#7c828a; --mut3:#a8acb3;
  --line:#dee1e6; --line2:#eef0f3; --line3:#f2f3f5;
  --bg:#f7f7f7; --white:#fff; --dark:#16181c; --dark-line:#2a2f37;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{color:var(--blue-d)}

/* Pas de min-width : la maquette d'origine imposait 1280px, ce qui coupait
   le contenu à droite dès que la fenêtre était plus étroite. */
.shell{display:flex;min-height:100vh;align-items:stretch;width:100%}
html,body{max-width:100%;overflow-x:clip}          /* clip et non hidden : hidden cassait la barre latérale collante */

/* ---------- sidebar ---------- */
.side{width:244px;flex:none;background:var(--white);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:28px;height:28px;border-radius:9999px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.brand-name{font-size:16px;font-weight:600;letter-spacing:-.2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut3);padding:0 8px 8px}
.nav-label+.nav-label,.nav-item+.nav-label{padding-top:16px}
.nav-item{position:relative;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.nav-item:hover{background:var(--bg)}
.nav-item.on{background:var(--line2)}
.nav-item.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--blue)}
.nav-item.on.root::before{display:none}
.nav-item span{position:relative;font-size:14px;font-weight:500}
.nav-item .amt{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--mut2);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.sync{background:var(--bg);border-radius:16px;padding:16px}
.sync-t{font-size:12px;font-weight:600;margin-bottom:4px}
.sync-b{font-size:12px;line-height:1.5;color:var(--mut2)}
.link{font-size:13px;font-weight:600;color:var(--blue);cursor:pointer}
.user{display:flex;align-items:center;gap:10px;padding:4px 8px}
.avatar{width:32px;height:32px;border-radius:9999px;background:var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--mut)}

/* ---------- header ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--white);border-bottom:1px solid var(--line);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;position:sticky;top:0;z-index:20}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.4px;line-height:1.2;margin:0}
.top-sub{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:var(--mut2)}
.dot-g{width:6px;height:6px;border-radius:9999px;background:var(--green);display:inline-block}
.dot-g.pulse{animation:pulse 2s ease-in-out infinite}
.dot-g.warn{background:var(--amber)}
.dot-g.off{background:var(--mut3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.refresh{border:1px solid var(--line);background:var(--white);border-radius:100px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;font-family:inherit}
.refresh:hover{border-color:var(--mut3);color:var(--ink)}
.refresh[disabled]{opacity:.5;cursor:default}
.seg{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:100px;padding:4px}
.seg-item{position:relative;padding:8px 16px;border-radius:100px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.seg-item.sm{padding:7px 15px}
.seg-item.on{background:var(--white);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{height:44px;padding:0 20px;border-radius:100px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-d)}
.btn-s{background:var(--line2);color:var(--ink)}

/* ---------- layout ---------- */
.screen{padding:28px 32px 64px;display:flex;flex-direction:column;gap:20px;max-width:1360px;width:100%;min-width:0}
main{min-width:0}                       /* sans ça, un enfant large empêche le flex de rétrécir */
.grid{min-width:0}
.card{min-width:0}
.card{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:24px}
.card.lg{padding:28px 32px}
.card-t{font-size:18px;font-weight:600;letter-spacing:-.2px}
.card-s{font-size:13px;color:var(--mut2);margin-top:4px}
.kpi-l{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut2);min-height:2.4em}
/* les montants ne doivent jamais passer à la ligne (le « € » se retrouvait seul
   en dessous) : ils rétrécissent avec la largeur disponible à la place */
.kpi-v{font-family:var(--mono);font-weight:500;font-size:clamp(17px,1.55vw,26px);letter-spacing:-.6px;margin-top:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-v.xl{font-size:clamp(21px,2.1vw,34px);letter-spacing:-1px}
.kpi-n{font-size:13px;color:var(--mut);margin-top:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--green)}
.neg{color:var(--red)}
.muted{color:var(--mut2)}
.grid{display:grid;gap:16px}
.row-between{display:flex;align-items:baseline;justify-content:space-between;gap:24px}
.head-block{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px}
.crumb .up{font-weight:500;color:var(--mut);cursor:pointer}
.crumb .sep{color:var(--mut3)}
.crumb .cur{font-weight:600}
.title-xl{font-size:32px;font-weight:400;letter-spacing:-.8px}
.title-sub{font-size:14px;color:var(--mut);margin-top:4px}
.tag{background:var(--line2);border-radius:100px;padding:4px 10px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.live-dot{width:6px;height:6px;border-radius:9999px;display:inline-block;background:var(--green)}
.stale{color:var(--mut3)}

/* ---------- tables ---------- */
.th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut2)}
.th.r,.td.r{text-align:right}
.tr{align-items:center;border-bottom:1px solid var(--bg)}
.tr:hover{background:var(--bg)}
.thead{border-bottom:1px solid var(--line);padding-bottom:10px}
.thead.soft{border-bottom-color:var(--line2)}
.empty{padding:28px;text-align:center;color:var(--mut2);font-size:14px}

/* ---------- bars / misc ---------- */
.track{height:6px;border-radius:3px;background:var(--line2)}
.track .fill{height:100%;border-radius:3px;background:var(--blue)}
.split{display:flex;border-radius:4px;overflow:hidden;gap:2px}
.tabs{display:flex;gap:28px;margin-top:20px;border-bottom:1px solid var(--line)}
.tab{padding-bottom:12px;cursor:pointer;position:relative;font-size:14px;font-weight:600;color:var(--mut2)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.legend .swatch{width:14px;height:2px;display:inline-block}
.legend .sq{width:10px;height:10px;border-radius:2px;display:inline-block}
.seg-row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer;background:transparent}
.seg-row.on{background:var(--bg)}
.dropzone{border:2px dashed var(--line);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-align:center;transition:border-color .12s,background .12s}
.dropzone:hover,.dropzone.over{border-color:var(--blue);background:#f7f9ff}
.conn{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.conn:hover{border-color:var(--mut3)}
.enveloppe{cursor:pointer;display:flex;flex-direction:column;gap:16px}
.enveloppe:hover{box-shadow:0 4px 12px rgba(0,0,0,.04);border-color:var(--mut3)}
.tip{background:var(--dark);border-radius:12px;padding:14px 16px;min-width:236px;pointer-events:none;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.16)}
.tip-l{display:flex;justify-content:space-between;gap:24px;margin-top:6px;font-size:13px;color:var(--mut3)}
.tip-l .v{font-family:var(--mono);font-weight:500;color:#fff;white-space:nowrap}
.tip-h{font-size:12px;font-weight:600;color:var(--mut3);letter-spacing:.04em;text-transform:uppercase}
.panel-dark{background:var(--dark);border-radius:16px;padding:20px;display:flex;flex-direction:column}
.alert{background:#f7f9ff;border:1px solid #cfdcff;border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;margin-top:24px}
.alert .bang{width:22px;height:22px;border-radius:9999px;background:var(--blue);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.overlay{position:fixed;inset:0;background:rgba(10,11,13,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:32px}
.modal{background:var(--white);border-radius:24px;padding:32px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:20px;max-height:90vh;overflow:auto}
.close{width:32px;height:32px;border-radius:9999px;background:var(--line2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--mut)}
.code{background:var(--bg);border-radius:12px;padding:14px;font-family:var(--mono);font-size:12px;line-height:1.8;color:var(--mut)}
.report{border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.6}
.report.ok{background:#f0fdf6;border:1px solid #b9ecd2;color:#0a5c3a}
.report.err{background:#fff5f5;border:1px solid #f3c9cd;color:#8c1620}
.report.busy{background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--mut3);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;right:24px;bottom:24px;z-index:80;max-width:420px}

/* ---------- auth ---------- */
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:400px;background:var(--white);border:1px solid var(--line);border-radius:24px;padding:36px}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--mut)}
.field input{height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;color:var(--ink);background:var(--white)}
.field input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.auth-error{background:#fff5f5;border:1px solid #f3c9cd;color:#8c1620;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px;line-height:1.5}
.auth-alt{text-align:center;margin-top:18px;font-size:13px;color:var(--mut)}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--mut3);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-google{height:44px;border-radius:100px;background:var(--white);border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;width:100%;font-family:inherit}
.btn-google:hover{background:var(--bg)}

/* ============================================================
   Adaptation à la largeur de fenêtre
   Les grilles sont définies en style inline (héritage de la maquette) :
   ces règles les surchargent aux tailles où elles déborderaient.
   Les tableaux à colonnes fixes défilent horizontalement dans leur carte
   plutôt que d'être coupés par le bord de la page.
   ============================================================ */
.scroll-x{overflow-x:auto}
.thead,.tr{min-width:max-content}

@media (max-width:1480px){
  .screen .grid[style*="1.4fr 1fr 1fr 1fr 1fr"],
  .screen .grid[style*="repeat(5,1fr)"]{grid-template-columns:repeat(3,1fr)!important}
}
@media (max-width:1180px){
  .top{padding:16px 20px}
  .screen{padding:20px 20px 56px}
  .card.lg{padding:22px 20px}
  .screen .grid[style*="1.4fr 1fr 1fr 1fr 1fr"],
  .screen .grid[style*="repeat(5,1fr)"],
  .screen .grid[style*="repeat(4,1fr)"],
  .screen .grid[style*="repeat(3,1fr)"],
  .screen .grid[style*="1.5fr 1fr"],
  .screen .grid[style*="1.7fr 1fr"],
  .screen .grid[style*="1fr 1.25fr"],
  .screen .grid[style*="1.2fr 1fr 1fr"],
  .screen .grid[style*="1.2fr 1fr 1fr"]{grid-template-columns:repeat(2,1fr)!important}
  .screen .grid[style*="1fr 264px"]{grid-template-columns:1fr!important}
  .screen .grid[style*="260px 1fr"]{grid-template-columns:1fr!important;justify-items:center}
}
@media (max-width:900px){
  .side{width:200px;padding:20px 12px}
  /* [style] pour égaler la spécificité des règles ci-dessus, sinon elles gagnent */
  .screen .grid[style],.screen .grid{grid-template-columns:1fr!important}
  .top h1{font-size:19px}
  /* en-têtes de carte : titre au-dessus du sélecteur au lieu de côte à côte */
  .card .row-between{flex-wrap:wrap;gap:12px}
  .seg{flex-wrap:wrap}
}
@media (max-width:720px){
  /* en dessous, l'app mobile dédiée (/m/) est plus adaptée */
  .side{display:none}
}
</style>

<body>
<div id="app"></div>
<input type="file" id="picker" accept=".csv,.txt,.tsv,.xlsx,.xlsm" style="display:none">

<script>
"use strict";

/* ============================================================
   Configuration
   ============================================================ */
const CONFIG = { defaultPeriod: 'Global' };

/* Aucune donnée de démonstration : tout ce qui s'affiche est calculé à partir
   des opérations, lignes et soldes de l'utilisateur. Ce qu'un relevé courtier
   ne permet pas de connaître (secteurs, composition des ETF, dividendes à
   venir) n'est pas affiché plutôt qu'inventé. */
const PAL = ['#0052ff','#0a0b0d','#4d84ff','#5b616e','#99b7ff','#a8acb3','#c8ccd2','#dee1e6','#eef0f3'];
const MLABEL = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MSHORT = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

/* ============================================================
   Formatage
   ============================================================ */
const eur  = n => (n ?? 0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const eur0 = n => Math.round(n ?? 0).toLocaleString('fr-FR') + ' €';
const pctS = n => (n ?? 0).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' %';
const num2 = n => Math.abs(n ?? 0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const sgn  = n => n > 0 ? '+' : (n < 0 ? '−' : '');
const sEur = n => sgn(n) + num2(n) + ' €';
const sPct = n => sgn(n) + num2(n) + ' %';
const cls  = n => n > 0 ? 'pos' : (n < 0 ? 'neg' : '');
const esc  = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const monoOf = name => (name || '?').replace(/[^A-Za-zÀ-ÿ ]/g,'').split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
const frDate = s => s ? s.slice(8) + '/' + s.slice(5,7) : '';
const monthLabel = s => s ? MSHORT[Number(s.slice(5,7))-1] + ' ' + s.slice(0,4) : '';
const monthLong  = s => s ? MLABEL[Number(s.slice(5,7))-1].toLowerCase() + ' ' + s.slice(0,4) : '';

/* ============================================================
   État
   ============================================================ */
const state = {
  view:'global', period:CONFIG.defaultPeriod, modal:false, modalTab:'saisie', pendingFile:null,
  editing:null, formCompte:'PEA', filt:'Tous',
  hov:null, year:new Date().getFullYear(), dHov:null, env:'Tout', tab:'titre', seg:null,
  importing:false, report:null,
  user:undefined                     // undefined = état d'auth pas encore connu, null = déconnecté
};

let snap = null;                                   // dernière valorisation reçue (Firestore, temps réel)
let conn = { status:'connecting', at:null, error:null };
let dataError = null;                              // lecture Firestore impossible (message lisible)
let unsubData = null;
const UI = window.PatrimoineUI;

function set(patch){
  let changed = false;
  for (const k in patch) if (state[k] !== patch[k]) { state[k] = patch[k]; changed = true; }
  if (changed) render();
}

/* ============================================================
   Auth + données (Firebase — voir /firebase-client.js)
   ============================================================ */

function subscribeData(){
  unsubData?.();
  dataError = null;
  unsubData = window.PatrimoineData.onSnapshot(
    s => {
      snap = s;
      dataError = null;
      if (s) conn = { status: s.quotes?.failed?.length ? 'partial' : 'live', at: Date.now(), error: null };
      render();
    },
    message => { dataError = message; render(); }
  );
}

function unsubscribeData(){
  unsubData?.(); unsubData = null;
  snap = null; dataError = null;
}

function handleUser(user){
  const changed = (state.user?.uid || null) !== (user?.uid || null) || state.user === undefined;
  state.user = user;
  if (!changed) return;
  if (user) subscribeData(); else unsubscribeData();
  // nouvelle session : on repart d'un état d'écran propre
  Object.assign(state, { view:'global', modal:false, editing:null, report:null, pendingFile:null });
  render();
}

function boot(){ window.PatrimoineAuth.onUser(handleUser); }

/** Sens réel d'une opération, quel que soit le signe utilisé par le fichier d'origine. */
const opAmount = o => (o.type === 'Achat' || o.type === 'Retrait') ? -Math.abs(o.montant) : Math.abs(o.montant);

/* ============================================================
   Sélecteurs sur l'instantané
   ============================================================ */
const T = () => snap?.totals || {};
const compte = name => snap?.comptes?.[name] || { value:0, mise:0, pv:0, pvPct:0, lines:[], cash:0 };
const hist = () => (snap?.history || []);

/* ============================================================
   Constantes réglementaires françaises (faits, pas des estimations)
   ============================================================ */
const PS_RATE = 0.172;             // prélèvements sociaux

/** Date de la première opération d'une enveloppe (Date) ou null. */
function premiereOp(compteName){
  const iso = snap?.comptes?.[compteName]?.premiereOperation;
  if (!iso) return null;
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? null : d;
}

/** Part du délai fiscal déjà écoulée, en %, pour la jauge d'antériorité. */
function anciennetePct(compteName, years){
  const first = premiereOp(compteName);
  if (!first) return 0;
  const ecoule = (Date.now() - first) / (365.25 * 86400000);
  return Math.max(0, Math.min(100, ecoule / years * 100)).toFixed(1);
}

/** Ancienneté réelle d'une enveloppe, depuis sa première opération. */
function anciennete(compteName){
  const first = premiereOp(compteName);
  if (!first) return '—';
  const mois = Math.max(0, Math.round((Date.now() - first) / (30.44 * 86400000)));
  return mois >= 24 ? `${Math.floor(mois / 12)} ans` : `${mois} mois`;
}

/**
 * Échéance fiscale d'une enveloppe : date de la première opération + n années.
 * « — » tant qu'aucune opération n'est connue, plutôt qu'une date inventée.
 */
function maturity(compteName, years){
  const d = premiereOp(compteName);
  if (!d) return { label:'—', date:null };
  d.setFullYear(d.getFullYear() + years);
  const iso = d.toISOString().slice(0,10);
  const reste = Math.max(0, Math.round((d - new Date()) / (30.44 * 86400000)));
  return { label: `${monthLabel(iso)}${reste ? ` · ${reste} mois` : ' · atteinte'}`, date: iso };
}

const PERIOD_DAYS = { Mensuel:31, Trimestriel:92, Annuel:365 };
const PERIOD_LABEL = { Mensuel:'sur 1 mois', Trimestriel:'sur 3 mois', Annuel:'sur 1 an', Global:'depuis le début' };

/**
 * Fenêtre d'historique correspondant à la période choisie, et performance sur
 * cette fenêtre (variation de la plus-value latente entre le début et la fin).
 *
 * `enough` dit si l'historique couvre réellement la période demandée : sinon on
 * le signale à l'écran au lieu de faire passer un chiffre plus court pour le
 * chiffre demandé. L'historique se construit à raison d'un point par jour, donc
 * les périodes longues ne sont exploitables qu'après plusieurs semaines d'usage.
 */
function periodWindow(period = state.period){
  const h = hist();
  const t = T();
  if (h.length < 2) {
    return { points:h, gain:t.pv || 0, pct:t.pvPct || 0, enough:false, label:PERIOD_LABEL[period] || '', period, fallback:'global' };
  }
  const last = h[h.length - 1];

  if (period === 'Global'){
    const first = h[0];
    return {
      points:h, enough:true, period, label:PERIOD_LABEL.Global,
      gain:last.val - last.cap,
      pct:last.cap ? (last.val - last.cap) / last.cap * 100 : 0,
      from:first.date, to:last.date
    };
  }

  const days = PERIOD_DAYS[period] || 365;
  const cutoffMs = Date.parse(last.date) - days * 86400000;
  const cutoff = new Date(cutoffMs).toISOString().slice(0,10);
  const points = h.filter(p => p.date >= cutoff);
  const base = h.filter(p => p.date <= cutoff).pop() || h[0];
  const window = points.length >= 2 ? points : h.slice(-2);
  const gain = (last.val - last.cap) - (base.val - base.cap);

  return {
    points:window, period, label:PERIOD_LABEL[period],
    gain, pct:last.cap ? gain / last.cap * 100 : 0,
    // historique suffisant seulement si un point antérieur au début de fenêtre existe
    enough: Date.parse(h[0].date) <= cutoffMs,
    from:window[0]?.date, to:last.date
  };
}

/**
 * Série d'une enveloppe : uniquement les points d'historique réellement
 * enregistrés. Pas de droite tracée de 0 à aujourd'hui quand l'historique
 * manque — elle faisait croire à une évolution qui n'a pas été mesurée.
 */
function serieFor(name){
  return hist()
    .filter(p => p.comptes && p.comptes[name])
    .map(p => ({ date:p.date, cap:p.comptes[name].mise, val:p.comptes[name].value }));
}

/* ============================================================
   Graphe : série → chemins SVG
   ============================================================ */
function chart(points, W, H, pad = 12){
  if (points.length < 2) return null;
  const vals = points.flatMap(p => [p.val, p.cap]);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (max === min) { max += 1; min -= 1; }
  const span = max - min;
  min -= span * 0.12; max += span * 0.12;

  const x = i => i * W / (points.length - 1);
  const y = v => pad + (max - v) / (max - min) * (H - 2 * pad);

  const line = key => points.map((p,i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join(' ');
  const area = line('val') + ' ' + points.map((p,i) => `L${x(points.length-1-i).toFixed(1)},${y(points[points.length-1-i].cap).toFixed(1)}`).join(' ') + ' Z';

  return {
    valPath:line('val'), capPath:line('cap'), areaPath:area,
    x, y, points,
    lastX:x(points.length - 1), lastY:y(points[points.length - 1].val)
  };
}

function statusLine(){
  const q = snap?.quotes;
  if (conn.status === 'offline') return { dot:'off', text:`Actualisation impossible — ${esc(conn.error || 'réseau indisponible')}` };
  if (!snap) return { dot:'off', text:'Connexion…' };
  const age = conn.at ? Math.max(0, Math.round((Date.now() - conn.at) / 1000)) : null;
  const when = age == null ? '' : (age < 90 ? `il y a ${age} s` : `il y a ${Math.round(age/60)} min`);
  const failed = q?.failed?.length || 0;
  const total = (snap.lines || []).length;
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return { dot:'off', text:'Hors ligne · dernières valeurs connues' };
  if (!snap.live) return { dot:'off', text: total ? `${total} ligne${total > 1 ? 's' : ''} · derniers cours connus` : 'Aucune ligne cotée' };
  if (failed) return { dot:'warn', text:`${total - failed}/${total} cotations à jour · ${failed} au dernier cours connu · ${when}` };
  return { dot:'pulse', text:`Cotations en direct · ${total} ligne${total > 1 ? 's' : ''} à jour · ${when}` };
}

function divTotalRealized(){
  const d = snap?.dividends || {};

}

/** Années disponibles : celles qui ont des versements, plus l'année en cours. */
function divYears(){
  const cur = new Date().getFullYear();
  return [...new Set([cur, ...Object.keys(snap?.dividends || {}).map(Number)])].sort((a, b) => b - a).slice(0, 5);
}

function divModel(year){
  const real = snap?.dividends?.[year];
  const months = real ? real.months.slice() : Array(12).fill(0);
  const lines = real ? real.lines.map(l => l.slice()) : Array.from({ length:12 }, () => []);
  const percu = real ? real.total : 0;
  const capital = T().capital || 0;
  // meilleurs versements de l'année, regroupés par libellé
  const byName = {};
  lines.flat().forEach(([n, v]) => { byName[n] = (byName[n] || 0) + v; });
  const top = Object.entries(byName).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([name, v]) => ({ name, amount:eur(v) }));
  const count = lines.reduce((s, l) => s + l.length, 0);
  return {
    months, lines, max: Math.max(1, ...months), percu, count, top,
    yieldPct: capital ? percu / capital * 100 : null
  };
}

/* ---------- répartition : calculée sur tes lignes réelles ---------- */
const ALLOC_TABS = [['titre','Par ligne'],['classe',"Par classe d'actifs"],['env','Par enveloppe'],['pays',"Par pays d'émission"]];

function allocRows(){
  const a = snap?.allocation || { titre:[], classe:[], pays:[], parEnveloppe:[] };
  if (state.env === 'Tout') {
    if (state.tab === 'classe') return a.classe;
    if (state.tab === 'env') return a.parEnveloppe;
    if (state.tab === 'pays') return a.pays || [];
    return a.titre;
  }
  const c = compte(state.env);
  const lines = c.lines.map(l => [l.name, l.value, l.classe, window.PatrimoineCore.paysOf(l)]);
  if (c.cash) lines.push(['Liquidités', c.cash, 'Liquidités', 'Liquidités']);
  if (c.balance) lines.push([c.name, c.balance, 'Épargne garantie', 'Épargne garantie']);
  const group = col => {
    const by = {};
    for (const r of lines) by[r[col]] = (by[r[col]] || 0) + r[1];
    return Object.entries(by).map(([k, v]) => [k, Math.round(v * 100) / 100]).filter(r => r[1] > 0).sort((x, y) => y[1] - x[1]);
  };
  if (state.tab === 'classe') return group(2);
  if (state.tab === 'pays') return group(3);
  return lines.map(r => [r[0], r[1]]).filter(r => r[1] > 0).sort((x, y) => y[1] - x[1]);
}

/** Commentaire factuel, calculé sur les montants affichés. */
function allocNote(rows, total){
  if (!rows.length) return '';
  const [name, v] = rows[0];
  const pc = v / total * 100;
  if (state.tab === 'pays') return 'Pays déduit du code ISIN : pays de la société pour une action, pays de domiciliation pour un fonds (sa composition réelle n\'est pas connue).';
  const what = { titre:'La première ligne', classe:'La première classe', env:'La première enveloppe' }[state.tab] || 'Le premier poste';
  const warn = state.tab === 'titre' && rows.length > 1 && pc > 25 ? ' — forte concentration sur un seul actif.' : '.';
  return `${what}, « ${esc(name)} », pèse ${pctS(pc)} du total${warn}`;
}

function allocationCard(){
  const envs = comptesList().filter(c => c.value > 0);
  if (state.env !== 'Tout' && !envs.some(c => c.name === state.env)) state.env = 'Tout';
  if (state.env !== 'Tout' && state.tab === 'env') state.tab = 'titre';
  if (!ALLOC_TABS.some(([v]) => v === state.tab)) state.tab = 'titre';

  const rows = allocRows();
  const total = rows.reduce((s, r) => s + r[1], 0) || 1;
  const sh = state.seg != null && state.seg < rows.length ? state.seg : null;

  let cum = 0;
  const segs = rows.map((r, i) => {
    const pc = r[1] / total * 100;
    const start = cum; cum += pc;
    return {
      i, color:PAL[i % PAL.length], w: sh === i ? 6.6 : 5.4,
      dash: Math.max(0.1, pc - 0.4).toFixed(2) + ' ' + (100 - pc + 0.4).toFixed(2),
      off: (25 - start).toFixed(2),
      label:r[0], pct:pctS(Math.round(pc * 10) / 10), amount:eur0(r[1]), pc, active: sh === i
    };
  });

  const tabs = ALLOC_TABS.filter(([v]) => !(v === 'env' && state.env !== 'Tout'))
    .map(([v, l]) => `<div class="tab${state.tab === v ? ' on' : ''}" data-act="tab" data-arg="${v}">${l}</div>`).join('');

  const arcs = segs.map(s => `<circle cx="21" cy="21" r="15.9" fill="none" stroke="${s.color}" stroke-width="${s.w}" stroke-dasharray="${s.dash}" stroke-dashoffset="${s.off}" data-hover="seg" data-hval="${s.i}" style="cursor:pointer"></circle>`).join('');
  const list = segs.map(s => `
    <div class="seg-row${s.active ? ' on' : ''}" data-hover="seg" data-hval="${s.i}">
      <span class="sq" style="width:10px;height:10px;border-radius:2px;background:${s.color};display:inline-block;flex:none"></span>
      <span style="font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.label)}</span>
      <div style="width:120px;height:6px;border-radius:3px;background:var(--line3);flex:none"><div style="width:${Math.max(2, s.pc)}%;height:100%;border-radius:3px;background:${s.color}"></div></div>
      <span class="mono" style="font-size:14px;font-weight:500;width:64px;text-align:right;white-space:nowrap">${s.pct}</span>
      <span class="mono" style="font-size:14px;color:var(--mut);width:104px;text-align:right;white-space:nowrap">${s.amount}</span>
    </div>`).join('');

  const centerLabel = { titre:'du patrimoine', classe:'réparti par classe', env:'réparti par enveloppe', pays:'réparti par pays' }[state.tab];

  return `
  <div class="card lg">
    <div class="head-block">
      <div>
        <div class="card-t">Répartition</div>
        <div class="card-s">Où est ton argent, et dans quelle proportion</div>
      </div>
      ${segControl([{ value:'Tout', label:'Tout', small:true }, ...envs.map(c => ({ value:c.name, label:c.name, small:true }))], state.env, 'env')}
    </div>
    <div class="tabs">${tabs}</div>
    ${rows.length ? `
    <div class="grid" style="grid-template-columns:260px 1fr;gap:40px;align-items:center;margin-top:28px">
      <div data-leave="seg" style="position:relative;width:236px;height:236px">
        <svg width="236" height="236" viewBox="0 0 42 42" style="display:block">
          <circle cx="21" cy="21" r="15.9" fill="none" stroke="#f2f3f5" stroke-width="5.4"></circle>
          ${arcs}
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:0 34px;text-align:center">
          <div class="mono" style="font-size:30px;font-weight:500;letter-spacing:-.8px;white-space:nowrap">${sh === null ? pctS(100) : segs[sh].pct}</div>
          <div style="font-size:13px;color:var(--mut);margin-top:2px;line-height:1.3">${sh === null ? centerLabel : esc(segs[sh].label)}</div>
          <div class="mono" style="font-size:13px;margin-top:6px;white-space:nowrap">${sh === null ? eur0(total) : segs[sh].amount}</div>
        </div>
      </div>
      <div data-leave="seg" style="display:flex;flex-direction:column;gap:2px;min-width:0">
        ${list}
        <div style="font-size:13px;color:var(--mut2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);line-height:1.5">${allocNote(rows, total)}</div>
      </div>
    </div>` : `<div class="empty">Aucune ligne pour l'instant — ajoute une ligne ou importe un relevé.</div>`}
  </div>`;
}

/* ---------- enveloppes : une carte par enveloppe réellement présente ---------- */
function enveloppeCard(c){
  const kind = kindOf(c);
  const gain = Math.max(0.5, Math.abs(c.pv)), base = Math.max(0.5, c.mise);
  const row = (k, v) => `<div style="display:flex;justify-content:space-between;gap:12px"><span style="font-size:13px;color:var(--mut)">${k}</span><span style="font-size:13px;font-weight:500;text-align:right;min-width:0">${v}</span></div>`;
  const gauge = (used, cap, label) => `
    <div style="border-top:1px solid var(--line2);padding-top:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:7px"><span style="font-size:12px;color:var(--mut2)">${label}</span><span class="mono" style="font-size:12px;font-weight:500;color:var(--mut)">${Math.round(used).toLocaleString('fr-FR')} / ${cap.toLocaleString('fr-FR')} €</span></div>
      <div class="track" style="background:var(--line2)"><div class="fill" style="width:${Math.max(0, Math.min(100, used / cap * 100)).toFixed(1)}%"></div></div>
    </div>`;

  let sub, tag, extra;
  if (kind === 'solde') {
    sub = 'Épargne disponible'; tag = 'Garanti';
    extra = `<div style="display:flex;flex-direction:column;gap:7px">
        ${row(`Intérêts ${new Date().getFullYear()} estimés`, c.interets ? `<span class="mono pos">${sEur(c.interets)}</span>` : '—')}
        ${row('Taux renseigné', c.taux ? `<span class="mono">${pctS(c.taux)}</span>` : '—')}
      </div>${c.plafond ? gauge(c.balance ?? c.value, c.plafond, 'Plafond réglementaire') : ''}`;
  } else if (kind === 'contrat') {
    const euro = c.lines.filter(l => l.classe === 'Fonds euro').reduce((s, l) => s + l.value, 0) + (c.balance || 0);
    const uc = c.value - euro - (c.cash || 0);
    sub = `${c.lines.length} support${c.lines.length > 1 ? 's' : ''}`; tag = 'Contrat';
    extra = `<div style="display:flex;flex-direction:column;gap:7px">
        ${row('Unités de compte', `${pctS(c.value ? uc / c.value * 100 : 0)} · <span class="mono">${eur(uc)}</span>`)}
        ${row('Fonds euro', `${pctS(c.value ? euro / c.value * 100 : 0)} · <span class="mono">${eur(euro)}</span>`)}
      </div>
      <div style="border-top:1px solid var(--line2);padding-top:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:7px"><span style="font-size:12px;color:var(--mut2)">Antériorité fiscale</span><span class="mono" style="font-size:12px;font-weight:500;color:var(--mut)">${anciennete(c.name)} / 8 ans</span></div>
        <div class="track" style="background:var(--line2)"><div class="fill" style="width:${anciennetePct(c.name, 8)}%"></div></div>
      </div>`;
  } else {
    const byPct = [...c.lines].sort((a, b) => b.pct - a.pct);
    const best = byPct[0], worst = byPct[byPct.length - 1];
    sub = `${c.lines.length} ligne${c.lines.length > 1 ? 's' : ''}${c.cash ? ' + liquidités' : ''}`; tag = 'Titres';
    extra = `<div style="display:flex;flex-direction:column;gap:7px">
        ${row('Meilleure ligne', best ? esc(best.name) + ` <span class="mono ${cls(best.pct)}">${sPct(best.pct)}</span>` : '—')}
        ${row('Moins bonne', worst && worst !== best ? esc(worst.name) + ` <span class="mono ${cls(worst.pct)}">${sPct(worst.pct)}</span>` : '—')}
      </div>${c.plafond ? gauge(c.mise, c.plafond, 'Plafond de versement') : ''}`;
  }

  return `
  <div class="card enveloppe" data-act="view" data-arg="${esc('c:' + c.name)}">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div style="display:flex;align-items:center;gap:12px;min-width:0">
        <div class="avatar" style="width:36px;height:36px;font-size:13px;color:var(--ink);flex:none">${esc(monoOf(c.name))}</div>
        <div style="min-width:0"><div style="font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</div><div style="font-size:12px;color:var(--mut2)">${sub}</div></div>
      </div>
      <span class="tag">${tag}</span>
    </div>
    <div>
      <div class="mono" style="font-size:28px;font-weight:500;letter-spacing:-.6px">${eur(c.value)}</div>
      <div style="display:flex;gap:14px;margin-top:6px;flex-wrap:wrap">
        ${kind === 'solde'
          ? `<span class="mono" style="font-size:13px;color:var(--mut)">${pctS((c.value / (T().patrimoine || 1)) * 100)} du patrimoine</span>`
          : `<span style="font-size:13px;color:var(--mut)">Mise <span class="mono" style="font-weight:500;color:var(--ink)">${eur(c.mise)}</span></span>
             <span class="mono ${cls(c.pv)}" style="font-size:13px;font-weight:500">${sEur(c.pv)} · ${sPct(c.pvPct)}</span>`}
      </div>
    </div>
    <div class="split" style="height:8px"><div style="flex:${base};background:var(--line2)"></div>${c.pv ? `<div style="flex:${gain};background:${c.pv >= 0 ? 'var(--green)' : 'var(--red)'}"></div>` : ''}</div>
    ${extra}
  </div>`;
}

  </div>`;
}

const settings = () => snap?.settings || { monthlyExpenses:null, goal:null };

const rawCash = () => window.PatrimoineData?.portfolio?.cash || {};

/**
 * Explique en clair d'où vient une trésorerie déduite, pour qu'un montant
 * inattendu soit vérifiable au lieu d'être subi.
 */
function cashExplain(compteName){
  const d = snap?.cashDetail?.[compteName];
  if (!d) return 'déduites de tes opérations';
  const parts = [];
  const entrees = (d.Versement || 0) + (d.Ouverture || 0);
  if (entrees) parts.push(`${eur0(entrees)} versés`);
  if (d.Vente) parts.push(`${eur0(d.Vente)} de ventes`);
  if (d.Dividende) parts.push(`${eur0(d.Dividende)} de dividendes`);
  if (d.Achat) parts.push(`− ${eur0(d.Achat)} investis`);
  if (d.Retrait) parts.push(`− ${eur0(d.Retrait)} retirés`);
  return parts.length ? `${parts.join(' · ')} (${d.count} opérations)` : 'déduites de tes opérations';
}

function monthsToTarget(rate, target = settings().goal){
  if (!target) return null;
  const t = T();
  let v = t.patrimoine || 0;
  const m = t.epargneMoyenne || 0;
  const r = rate / 100 / 12;
  for (let i = 1; i <= 600; i++){
    v = v * (1 + r) + m;
    if (v >= target) return i;
  }
  return null;
}
function targetDate(rate){
  const n = monthsToTarget(rate);
  if (n == null) return '—';
  const d = new Date(); d.setMonth(d.getMonth() + n);
  return MSHORT[d.getMonth()] + ' ' + d.getFullYear();
}
function projectionText(){
  const t = T();
  const g = settings().goal;
  if (!g) return 'Fixe un objectif pour voir en combien de temps tu l\'atteins.';
  return `À ${eur0(t.epargneMoyenne || 0)}/mois (ta moyenne observée) et 8 % de rendement, l'objectif est atteint en <span style="font-weight:600;color:var(--ink)">${targetDate(8)}</span>.`;
}
function projectionPaths(){
  const t = T();
  const series = [4, 8, 12].map(rate => {
    const pts = [];
    let v = t.patrimoine || 0;
    const r = rate / 100 / 12, m = t.epargneMoyenne || 0;
    for (let i = 0; i <= 60; i += 6){ pts.push(v); for (let k = 0; k < 6; k++) v = v * (1 + r) + m; }
    return { rate, pts };
  });
  const max = Math.max(20000, ...series.flatMap(s => s.pts));
  const path = s => s.pts.map((v,i) => `${i ? 'L' : 'M'}${(i / (s.pts.length-1) * 320).toFixed(1)},${(112 - v / max * 90).toFixed(1)}`).join(' ');
  return series.map(s => s.rate === 8
    ? `<path d="${path(s)}" fill="none" stroke="#0052ff" stroke-width="2"/>`
    : `<path d="${path(s)}" fill="none" stroke="#a8acb3" stroke-width="1.5" stroke-dasharray="4 3"/>`).join('');
}

/** Dividendes encaissés sur une enveloppe pour l'année en cours (toujours positifs). */
function divFor(name){
  const y = String(new Date().getFullYear());
  return (snap?.operations || []).filter(o => o.compte === name && o.type === 'Dividende' && o.date.startsWith(y))
    .reduce((s, o) => s + Math.abs(o.montant), 0);
}
/** Versements réels sur une enveloppe (somme des versements et ouvertures). */
function versementsFor(name){
  return (snap?.operations || []).filter(o => o.compte === name && (o.type === 'Versement' || o.type === 'Ouverture'))
    .reduce((s, o) => s + Math.abs(o.montant), 0);
}

    </div>`).join('');

  const euro = c.lines.filter(l => l.classe === 'Fonds euro').reduce((s, l) => s + l.value, 0) + (c.balance || 0);
  const uc = Math.max(0, c.value - euro - (c.cash || 0));
  const actions = c.lines.filter(l => l.classe === 'ETF actions' || l.classe === 'Actions en direct').reduce((s, l) => s + l.value, 0);
  const oblig = c.lines.filter(l => l.classe === 'Obligations').reduce((s, l) => s + l.value, 0);
  const best = c.lines[0], worst = c.lines[c.lines.length - 1];
  const ucPct = c.value ? uc / c.value * 100 : 0;

  return `<div class="screen">
    ${crumb(name)}
    ${headerBlock(name, `${c.lines.length} support${c.lines.length > 1 ? 's' : ''} · valorisé le ${new Date(snap?.asOf || Date.now()).toLocaleString('fr-FR')}`)}
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      ${kpiBox('Valeur', eur(c.value))}${kpiBox('Mise', eur(c.mise))}${kpiBox(c.pv >= 0 ? 'Plus-value latente' : 'Moins-value latente', sEur(c.pv), cls(c.pv))}${kpiBox('Performance', sPct(c.pvPct), cls(c.pvPct))}
    </div>
    <div class="grid" style="grid-template-columns:1fr 1.25fr">
      <div class="card">
        <div class="card-t">Fonds euro vs unités de compte</div>
        <div style="display:flex;align-items:center;gap:24px;margin-top:22px;flex-wrap:wrap">
          <svg width="132" height="132" viewBox="0 0 42 42">
            <circle cx="21" cy="21" r="15.9" fill="none" stroke="#dee1e6" stroke-width="6"></circle>
            <circle cx="21" cy="21" r="15.9" fill="none" stroke="#0052ff" stroke-width="6" stroke-dasharray="${Math.max(0.1, ucPct - 0.1).toFixed(1)} ${(100 - ucPct + 0.1).toFixed(1)}" stroke-dashoffset="25"></circle>
          </svg>
          <div style="display:flex;flex-direction:column;gap:14px">
            <div><div class="legend"><span class="sq" style="background:var(--blue)"></span><span style="font-size:14px;font-weight:500;color:var(--ink)">Unités de compte</span></div><div class="mono" style="font-size:18px;font-weight:500;margin-top:4px;margin-left:18px">${eur(uc)} · ${pctS(ucPct)}</div></div>
            <div><div class="legend"><span class="sq" style="background:var(--line)"></span><span style="font-size:14px;font-weight:500;color:var(--ink)">Fonds euro</span></div><div class="mono" style="font-size:18px;font-weight:500;margin-top:4px;margin-left:18px">${eur(euro)} · ${pctS(c.value ? euro / c.value * 100 : 0)}</div></div>
          </div>
        </div>
        <div style="border-top:1px solid var(--line2);margin-top:22px;padding-top:16px;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--mut)">Poche actions</span><span class="mono" style="font-size:13px;font-weight:500">${eur(actions)} · ${pctS(c.value ? actions / c.value * 100 : 0)}</span></div>
          <div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--mut)">Poche obligataire</span><span class="mono" style="font-size:13px;font-weight:500">${eur(oblig)} · ${pctS(c.value ? oblig / c.value * 100 : 0)}</span></div>
          <div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--mut)">Antériorité fiscale</span><span class="mono" style="font-size:13px;font-weight:500">${anciennete(name)} / 8 ans</span></div>
        </div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <div class="card-t">Plus ou moins-value par support</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px">${pvRows}</div>
        <div style="display:flex;gap:24px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2);flex-wrap:wrap">
          <div><div style="font-size:12px;color:var(--mut2)">Meilleur support</div><div style="font-size:14px;font-weight:600;margin-top:2px">${best ? esc(best.name.slice(0, 26)) + ` <span class="mono ${cls(best.pv)}" style="font-weight:500">${sEur(best.pv)}</span>` : '—'}</div></div>
          <div><div style="font-size:12px;color:var(--mut2)">Moins bon support</div><div style="font-size:14px;font-weight:600;margin-top:2px">${worst && worst !== best ? esc(worst.name.slice(0, 26)) + ` <span class="mono ${cls(worst.pv)}" style="font-weight:500">${sEur(worst.pv)}</span>` : '—'}</div></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-t" style="margin-bottom:16px">Détail des supports</div>
      <div class="scroll-x"><div class="thead" style="display:grid;grid-template-columns:${cols}">
        <span class="th">Support</span><span class="th">ISIN</span><span class="th r">Parts</span><span class="th r">Cotation</span><span class="th r">PRU</span><span class="th r">Montant</span><span class="th r">± €</span><span class="th r">Actions</span>
      </div>
      ${rows}${cashRow(c, cols)}
      ${!rows && !c.cash ? '<div class="empty">Aucun support — ajoute une ligne ou importe l\'export du contrat.</div>' : ''}</div>
    </div>
  </div>`;
}

/** Épargne en solde : Livret A, LDDS, LEP… */
function viewSolde(name){
  const c = compte(name);
  const t = T();
  const part = t.patrimoine ? c.value / t.patrimoine * 100 : 0;
  const mensuel = settings().monthlyExpenses;   // null tant que non renseigné : aucun chiffre inventé
  const autres = comptesList().filter(x => x.name !== name && x.value > 0);
  const colors = ['var(--blue)', 'var(--green)', '#99b7ff', '#a8acb3', '#c8ccd2'];

  return `<div class="screen">
    ${crumb(name)}
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap">
      <div>
        <div class="title-xl">${esc(name)}</div>
        <div class="title-sub">Épargne disponible · capital garanti · taux ${c.taux ? pctS(c.taux) : 'non renseigné'}</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="btn btn-s" data-act="delBalance" data-arg="${esc(name)}">Supprimer</div>
        <div class="btn btn-p" data-act="editBalance" data-arg="${esc(name)}">Mettre à jour le solde</div>
      </div>
    </div>
    <div class="grid" style="grid-template-columns:1.2fr 1fr 1fr">
      <div class="card">
        <div class="kpi-l">Solde actuel</div>
        <div class="kpi-v xl">${eur(c.value)}</div>
        ${c.plafond ? `
        <div style="display:flex;justify-content:space-between;margin-top:20px;margin-bottom:8px"><span style="font-size:13px;color:var(--mut)">Plafond réglementaire</span><span class="mono" style="font-size:13px;font-weight:500">${Math.round(c.value).toLocaleString('fr-FR')} / ${c.plafond.toLocaleString('fr-FR')} €</span></div>
        <div style="height:12px;border-radius:6px;background:var(--line2)"><div style="width:${Math.max(0, Math.min(100, c.value / c.plafond * 100)).toFixed(1)}%;height:100%;border-radius:6px;background:var(--blue)"></div></div>
        <div style="font-size:13px;color:var(--mut);margin-top:10px">${pctS(c.value / c.plafond * 100)} du plafond · ${eur0(Math.max(0, c.plafond - c.value))} encore versables</div>`
        : `<div style="font-size:13px;color:var(--mut);margin-top:12px">Mis à jour ${esc(window.PatrimoineData?.portfolio?.balances?.[name]?.updatedAt ? 'le ' + frDate(window.PatrimoineData.portfolio.balances[name].updatedAt) : 'manuellement')}</div>`}
      </div>
      <div class="card">
        <div class="kpi-l">Intérêts ${new Date().getFullYear()} estimés</div>
        <div class="kpi-v xl pos">${c.interets ? sEur(c.interets) : '—'}</div>
        <div style="font-size:13px;color:var(--mut);margin-top:8px;line-height:1.5">${c.taux ? `Solde × taux renseigné (${pctS(c.taux)}). Le calcul réel se fait par quinzaines.` : 'Renseigne le taux du livret pour estimer les intérêts.'}</div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
          <div class="kpi-l">Matelas de sécurité</div>
          <span class="link" style="font-size:12px;cursor:pointer" data-act="editExpenses">${mensuel ? 'Modifier' : 'Renseigner'}</span>
        </div>
        ${mensuel ? `
        <div class="kpi-v xl">${(c.value / mensuel).toLocaleString('fr-FR', { maximumFractionDigits:1 })} mois</div>
        <div style="font-size:13px;color:var(--mut);margin-top:8px;line-height:1.5">Sur la base de ${eur0(mensuel)} de dépenses mensuelles que tu as renseignées. Repère courant : 3 à 6 mois${c.value / mensuel >= 3 && c.value / mensuel <= 6 ? ' — tu es dans la cible.' : '.'}</div>`
        : `<div class="kpi-v xl">—</div>
        <div style="font-size:13px;color:var(--mut);margin-top:8px;line-height:1.5">Renseigne tes dépenses mensuelles pour savoir combien de mois ce livret couvre.</div>`}
      </div>
    </div>
    ${autres.length ? `
    <div style="background:var(--ink);border-radius:24px;padding:28px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px;align-items:center">
      <div>
        <div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut3)">Part dans le patrimoine</div>
        <div style="font-size:24px;font-weight:400;letter-spacing:-.5px;color:#fff;margin-top:8px;line-height:1.35">${esc(name)} représente ${pctS(part)} de ton patrimoine${c.taux ? `, rémunéré à ${pctS(c.taux)}` : ''}.</div>
        <div style="font-size:14px;color:var(--mut3);line-height:1.6;margin-top:12px">Une épargne de précaution couvre en général 3 à 6 mois de dépenses. Au-delà, l'excédent peut perdre du pouvoir d'achat si l'inflation dépasse le taux du livret.</div>

      <div>
        <div style="display:flex;height:40px;border-radius:8px;overflow:hidden;gap:2px">
          <div style="flex:${Math.max(1, c.value)};background:#3f4652;display:flex;align-items:center;padding-left:14px;min-width:0"><span class="mono" style="font-size:13px;font-weight:500;color:#fff;white-space:nowrap">${pctS(part)}</span></div>
          ${autres.map((x, i) => `<div style="flex:${Math.max(1, x.value)};background:${colors[i % colors.length]}"></div>`).join('')}
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
          <div style="display:flex;justify-content:space-between;gap:12px"><span style="font-size:13px;color:var(--mut3)">${esc(name)}</span><span class="mono" style="font-size:13px;color:#fff">${eur(c.value)}</span></div>
          ${autres.map(x => `<div style="display:flex;justify-content:space-between;gap:12px"><span style="font-size:13px;color:var(--mut3)">${esc(x.name)}</span><span class="mono" style="font-size:13px;color:#fff">${eur(x.value)}</span></div>`).join('')}
        </div>
      </div>
    </div>` : ''}
  </div>`;
}

function viewCompte(name){
  const c = snap?.comptes?.[name];
  if (!c) {
    return `<div class="screen">${crumb(name)}<div class="card"><div class="empty">L'enveloppe « ${esc(name)} » n'existe plus. <span class="link" data-act="view" data-arg="global">Retour à la vue globale →</span></div></div></div>`;
  }
  const kind = kindOf(c);
  return kind === 'solde' ? viewSolde(name) : kind === 'contrat' ? viewContrat(name) : viewTitres(name);
}

/* ============================================================

const OP_TYPES = ['Versement', 'Retrait', 'Achat', 'Vente', 'Dividende', 'Ouverture'];

function viewOps(){
  const cols = '110px 140px 110px 1fr 100px 130px 60px';
  const all = snap?.operations || [];
  const list = all.filter(o => state.filt === 'Tous' || o.compte === state.filt);
  const rows = list.map(o => `
    <div class="tr" style="display:grid;grid-template-columns:${cols};padding:13px 0;align-items:center">
      <span class="mono" style="font-size:13px;color:var(--mut)">${o.dateFr || frDate(o.date)}</span>
      <span style="font-size:14px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.compte)}</span>
      <span style="font-size:13px;font-weight:600">${esc(o.type)}</span>
      <span style="font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.libelle)}</span>
      <span class="mono" style="font-size:13px;color:var(--mut2)">${esc(o.ticker || '—')}</span>
      <span class="mono ${o.type === 'Dividende' ? 'pos' : ''}" style="font-size:14px;font-weight:500;text-align:right">${sEur(opAmount(o))}</span>
      <span style="text-align:right"><span style="font-size:12px;font-weight:600;color:var(--red);cursor:pointer" data-act="delOp" data-arg="${o.idx}" title="Supprimer cette opération">Suppr.</span></span>
    </div>`).join('') || '<div class="empty">Aucune opération pour ce filtre.</div>';

  const comptes = [...new Set(all.map(o => o.compte))];
  if (state.filt !== 'Tous' && !comptes.includes(state.filt)) state.filt = 'Tous';

  return `<div class="screen">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <div>
        <div class="title-xl">Journal des opérations</div>
        <div class="title-sub">${all.length} opération${all.length > 1 ? 's' : ''}${T().premiereOperation ? ' depuis ' + monthLong(T().premiereOperation) : ''} · doublons ignorés à l'import</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        ${comptes.length > 1 ? segControl([{ value:'Tous', label:'Tous' }, ...comptes.map(c => ({ value:c, label:c }))], state.filt, 'filt') : ''}
        <div class="btn btn-p" data-act="addOp">Ajouter une opération</div>
      </div>
    </div>
    <div class="card">
      <div class="scroll-x"><div class="thead" style="display:grid;grid-template-columns:${cols}">
        <span class="th">Date</span><span class="th">Compte</span><span class="th">Type</span><span class="th">Libellé</span><span class="th">Ticker</span><span class="th r">Montant</span><span class="th r"></span>
      </div>
      ${rows}</div>
    </div>
  </div>`;
}

/* ============================================================

  const onSaisie = state.modalTab === 'saisie';
  return `
  <div class="overlay" data-act="modal" data-arg="0">
    <div class="modal" data-act="stop" role="dialog" aria-modal="true" aria-label="Ajouter des données">
      <div class="head-block">
        <div>
          <div style="font-size:24px;font-weight:400;letter-spacing:-.5px">Ajouter des données</div>
          <div style="font-size:14px;color:var(--mut);margin-top:4px">Saisis tes lignes à la main, ou importe un fichier de ton courtier</div>
        </div>
        <div class="close" data-act="modal" data-arg="0" aria-label="Fermer">✕</div>
      </div>

      <div class="segbar" style="display:flex;background:var(--bg);border-radius:100px;padding:4px;gap:2px">

/* ---------- saisie manuelle d'une ligne ----------
   Le type d'actif (action, ETF, obligation, fonds euro…) n'est pas demandé :
   il est déduit du libellé par PatrimoineCore.classOf. */

const isSoldeCompte = c => window.PatrimoineCore.isSoldeCompte(c);
const BASE_COMPTES = ['PEA', 'CTO', 'Assurance Vie', 'PER', 'Livret A', 'LDDS', 'LEP'];

function manualForm(){
  const existing = Object.keys(snap?.comptes || {});
  const ed = state.editing;                                  // ligne en cours de modification
  const compteVal = ed?.compte || state.formCompte || 'PEA';
  const comptes = [...new Set([...existing, ...BASE_COMPTES, compteVal])];
  const lines = snap?.lines || [];
  const cashRows = Object.entries(snap?.comptes || {})
    .filter(([name, c]) => c.cash > 0 || rawCash()[name] != null)
    .map(([name, c]) => ({ compte:name, value:c.cash, derive: rawCash()[name] == null }));
  const balances = Object.entries(snap?.comptes || {}).filter(([, c]) => c.balance != null);
  const solde = isSoldeCompte(compteVal);
  const today = new Date().toISOString().slice(0,10);
  const soldeActuel = snap?.comptes?.[compteVal]?.balance ?? null;
  const fr = n => n == null || n === '' ? '' : String(n).replace('.', ',');

  const enveloppeChips = comptes.map(c =>
    `<div class="seg-item${c === compteVal ? ' on' : ''}" style="padding:8px 14px;font-size:13px" data-act="formCompte" data-arg="${esc(c)}">${esc(c)}</div>`
  ).join('') + `<div class="seg-item" style="padding:8px 14px;font-size:13px;color:var(--blue)" data-act="newCompte">+ Autre</div>`;

  const total = lines.length + cashRows.length + balances.length;

  return `
    <form id="posForm" novalidate data-epoch="${formEpoch}">
      <div class="field">
        <label>Enveloppe</label>
        ${ed
          // une ligne existante reste dans son enveloppe : la changer ici créerait un doublon
          ? `<div style="font-size:14px;font-weight:600;padding:6px 0">${esc(compteVal)}</div>`
          : `<div style="display:flex;gap:6px;flex-wrap:wrap;background:var(--bg);border-radius:20px;padding:4px">${enveloppeChips}</div>`}
      </div>

      ${solde ? `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field">
          <label for="pSolde">Solde actuel de ${esc(compteVal)} *</label>
          <input id="pSolde" type="text" inputmode="decimal" placeholder="ex. 6 681,68" value="${fr(soldeActuel)}" autocomplete="off">
        </div>
        <div class="field">
          <label for="pTaux">Taux annuel (%)</label>
          <input id="pTaux" type="text" inputmode="decimal" placeholder="ex. 2,4" value="${fr(snap?.comptes?.[compteVal]?.taux)}" autocomplete="off">
        </div>
      </div>
      <div style="font-size:12px;color:var(--mut2);line-height:1.5;margin-bottom:14px">
        Le solde remplace la valeur précédente. Le taux (facultatif) sert à estimer les intérêts de l'année.
      </div>` : `
      <div class="field">
        <label for="pName">Nom ou code ISIN *</label>
        <input id="pName" placeholder="Air Liquide  ·  ou  FR0000120073" value="${ed ? esc(ed.name || ed.isin || '') : ''}" autocomplete="off" maxlength="120">
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px">
        <div class="field">
          <label for="pQty">Quantité *</label>
          <input id="pQty" type="text" inputmode="decimal" placeholder="ex. 4" value="${ed ? fr(ed.qty) : ''}" autocomplete="off">
        </div>
        <div class="field">
          <label for="pPru">Prix d'achat unitaire (€) *</label>
          <input id="pPru" type="text" inputmode="decimal" placeholder="ex. 168,40" value="${ed ? fr(ed.pru) : ''}" autocomplete="off">
        </div>
        <div class="field">
          <label for="pDate">Date d'achat</label>
          <input id="pDate" type="date" max="${today}" value="${ed ? (ed.buyDate || '') : today}">
        </div>
      </div>
      <div style="font-size:12px;color:var(--mut2);line-height:1.5;margin-bottom:14px">
        Avec un code ISIN (ou un ticker comme <span class="mono">AI</span>), le cours est récupéré automatiquement.
        Avec un simple nom, la ligne reste au prix que tu saisis.
      </div>`}

      <div style="display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap">
        ${ed ? `<span style="font-size:12px;color:var(--mut2);margin-right:auto">Modification de « ${esc(ed.name)} »</span>
                <div class="btn btn-s" data-act="cancelEdit">Annuler</div>` : `<div class="btn btn-s" data-act="modal" data-arg="0">Fermer</div>`}
        <button type="submit" class="btn btn-p" style="border:0;font-family:inherit" ${state.importing ? 'disabled' : ''}>
          ${state.importing ? '<span class="spin"></span>' : ''}${ed ? 'Enregistrer les modifications' : (solde ? 'Enregistrer le solde' : 'Ajouter la ligne')}
        </button>
      </div>
    </form>

    ${total ? `
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line2)">
      <div class="th" style="font-size:12px;margin-bottom:8px">Mes lignes (${total})</div>
      <div style="display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto">
        ${lines.map((l, li) => `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.name)}</div>
              <div style="font-size:11px;color:var(--mut2)">${esc(l.compte)} · ${(l.qty ?? 0).toLocaleString('fr-FR', { maximumFractionDigits:6 })} × ${eur(l.pru)}${l.live ? ' · coté' : ''}</div>
            </div>

const app = document.getElementById('app');
const picker = document.getElementById('picker');

/* Les valeurs saisies survivent aux rafraîchissements de l'écran (arrivée
   d'une cotation, synchronisation…). `formEpoch` change quand le formulaire
   DOIT repartir de zéro : autre ligne à modifier, enregistrement réussi. */
let formEpoch = 0;
function captureInputs(){
  // époque du formulaire AFFICHÉ : si elle a changé depuis, la saisie ne doit pas revenir
  const shown = app.querySelector('form[data-epoch]');
  const kept = { epoch: shown ? Number(shown.dataset.epoch) : formEpoch, vals:{}, focus:null };
  app.querySelectorAll('form input[id], form select[id], form textarea[id]').forEach(el => { if (el.type !== 'file') kept.vals[el.id] = el.value; });
  const a = document.activeElement;
  if (a?.id && app.contains(a)) kept.focus = { id:a.id, s:a.selectionStart, e:a.selectionEnd };
  return kept;
}
function restoreInputs(kept){
  if (kept.epoch !== formEpoch) return;
  for (const [id, v] of Object.entries(kept.vals)) {
    const el = document.getElementById(id);
    if (el && app.contains(el) && el.value !== v) el.value = v;
  }
  if (kept.focus) {
    const el = document.getElementById(kept.focus.id);
    if (el && app.contains(el)) {
      el.focus({ preventScroll:true });
      try { if (kept.focus.s != null) el.setSelectionRange(kept.focus.s, kept.focus.e); } catch { /* type date */ }
    }
  }
}

/** Les éléments cliquables non natifs deviennent utilisables au clavier. */
function keyboardify(){
  app.querySelectorAll('[data-act]:not(button):not(a):not(input):not(.overlay):not([data-act="stop"])').forEach(el => {
    el.setAttribute('role', 'button');
    if (!el.hasAttribute('tabindex')) el.tabIndex = 0;
  });
}

function render(){
  if (state.user === undefined){ UI.loading(app); return; }
  if (state.user === null){
    // l'écran de connexion gère lui-même son état : on ne le redessine pas
    if (!app.querySelector('.pk-auth')) UI.mountAuth(app);
    return;
  }
  if (!snap){
    app.innerHTML = `<div class="auth-shell"><div class="card" style="max-width:440px">${
      dataError
        ? `<div class="card-t">Connexion aux données impossible</div><div class="card-s" style="margin-top:6px;line-height:1.5">${esc(dataError)}</div>
           <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><div class="btn btn-p" data-act="retryData">Réessayer</div><div class="btn btn-s" data-act="signOut">Se déconnecter</div></div>`
        : `<div class="empty"><span class="spin"></span>Chargement du portefeuille…</div>`
    }</div></div>`;
    keyboardify();
    return;
  }
  const view = state.view.startsWith('c:') ? viewCompte(state.view.slice(2)) : (state.view === 'ops' ? viewOps() : viewGlobal());
  const kept = captureInputs();
  app.innerHTML = `<div class="shell">${sidebar()}<main>${header()}${dataError ? `<div class="report err" style="margin:16px 32px 0">${esc(dataError)} <span class="link" data-act="retryData">Réessayer</span></div>` : ''}${view}</main></div>${modal()}`;
  restoreInputs(kept);
  keyboardify();
  app.querySelectorAll('[data-leave]').forEach(el => el.addEventListener('mouseleave', () => set({ [el.dataset.leave]: null })));
  wirePositionForm();
  app.querySelectorAll('[data-drop]').forEach(el => {
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('over');
      const f = e.dataTransfer?.files?.[0];
      if (f) set({ pendingFile:f, report:null, modal:true, modalTab:'fichier' });
    });
  });
}

/** Formulaire de saisie manuelle d'une ligne ou d'un solde. */
function wirePositionForm(){
  const form = app.querySelector('#posForm');
  if (!form) return;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (state.importing) return;                              // double clic
    const v = id => app.querySelector('#' + id)?.value ?? '';
    const num = window.PatrimoineCore.num;
    const ed = state.editing;
    const compte = ed?.compte || state.formCompte || 'PEA';
    const solde = isSoldeCompte(compte);

    // lire les champs AVANT tout set(), qui redessine la page
    const saisie = solde
      ? { montant: num(v('pSolde')), taux: v('pTaux').trim() === '' ? null : num(v('pTaux')) }
      : { nameOrIsin: v('pName').trim(), qty: num(v('pQty')), pru: num(v('pPru')), date: v('pDate') };
    // identifiant inchangé lors d'une modification : on garde nom, ISIN et ticker
    // d'origine (sinon l'ISIN, qui sert à la cotation, serait perdu)
    if (!solde && ed && [ed.name, ed.isin, ed.ticker].includes(saisie.nameOrIsin)) {
      Object.assign(saisie, { name: ed.name, isin: ed.isin || '', ticker: ed.ticker || '' });
    }

    // vérifications immédiates, message précis sur le champ concerné
    const fail = (msg, id) => { state.report = { error:msg, title:'Vérifie ta saisie' }; render(); app.querySelector('#' + id)?.focus(); };
    if (solde) {
      if (saisie.montant == null || saisie.montant < 0) return fail('Indique le solde en euros (ex. 6 681,68).', 'pSolde');
      if (v('pTaux').trim() !== '' && (saisie.taux == null || saisie.taux < 0 || saisie.taux > 20)) return fail('Taux invalide : indique un pourcentage entre 0 et 20 (ex. 2,4).', 'pTaux');
    } else {
      if (!saisie.nameOrIsin) return fail('Indique le nom ou le code ISIN de la ligne.', 'pName');
      if (saisie.qty == null || saisie.qty <= 0) return fail('Indique une quantité supérieure à 0 (ex. 4 ou 0,5).', 'pQty');
      if (saisie.pru == null || saisie.pru < 0) return fail('Indique le prix d\'achat unitaire en euros (ex. 168,40).', 'pPru');
    }

    set({ importing:true, report:null });
    try {
      if (solde) {
        await window.PatrimoineData.updateBalance(compte, saisie.montant, saisie.taux);
        state.report = { message:`Solde de ${compte} enregistré : ${eur(saisie.montant)}` };
      } else {
        const res = await window.PatrimoineData.savePosition({ ...saisie, compte, replaces: ed?.name });
        state.report = { message:`${res.name} ${res.created ? 'ajoutée' : 'mise à jour'} dans ${compte}`, pending:res.pending };
      }
      state.editing = null;
      formEpoch++;                                            // formulaire vidé pour la saisie suivante
    } catch (e2) {
      state.report = { error:e2.message };
    } finally {
      set({ importing:false });
      render();
    }
  });
}

async function upload(file){
  set({ importing:true, report:null });
  try {
    const res = await window.PatrimoineData.importFile(file);
    state.report = res;
    state.pendingFile = null;
    UI.toast(`${file.name} importé`, 'ok');
  } catch (e) {
    state.report = { error:e.message, title:'Import refusé' };
  } finally {
    set({ importing:false });
    render();
  }
}

const parseAmount = (raw, { allowEmpty = false, max = 1e10 } = {}) => {
  if (allowEmpty && String(raw).trim() === '') return null;
  const n = window.PatrimoineCore.num(raw);
  if (n == null || n < 0 || n > max) throw new Error('Montant invalide : indique un nombre positif (ex. 1 250,50).');
  return n;
};
const frNum = n => n == null ? '' : String(n).replace('.', ',');

  editBalance: compteName => {

      title:`Solde · ${compteName}`,
      fields:[
        { name:'solde', label:'Solde actuel (€)', value:frNum(c?.balance ?? ''), inputmode:'decimal', placeholder:'ex. 6 681,68' },
        { name:'taux', label:'Taux annuel (%) — facultatif', value:frNum(c?.taux ?? ''), inputmode:'decimal', placeholder:'ex. 2,4' }
      ],

        : `La ligne est retirée de ${compte}.`,

      title:'Ajouter une opération',
      message:'Versement, retrait, dividende… Le sens (entrée ou sortie) est déduit du type : saisis le montant en positif.',
      fields:[
        { name:'date', label:'Date', type:'date', value:new Date().toISOString().slice(0,10), max:new Date().toISOString().slice(0,10) },

      ],

    });

  signOut: () => { UI.loading(app, 'Déconnexion…'); return window.PatrimoineAuth.signOut(); },
  refreshNow: async () => {

    conn = { ...conn, status:'connecting' }; render();

    catch (e) { conn = { status:'offline', at:conn.at, error:e.message }; render(); }

function dispatch(t){
  const fn = ACTIONS[t.dataset.act];
  if (fn) UI.run(fn, t.dataset.arg);
}

/* Un rafraîchissement de l'écran entre l'appui et le relâchement (survol d'un
   graphique, cotation qui arrive…) remplace l'élément visé : le navigateur
   n'émet alors aucun « click » et le bouton semble ne pas répondre. On retient
   l'action visée à l'appui et on l'exécute au relâchement si le click manque. */
const actSig = t => t ? t.dataset.act + '␀' + (t.dataset.arg ?? '') : null;
let pressedSig = null, clickSeen = false;
app.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  pressedSig = actSig(e.target.closest('[data-act]'));
  clickSeen = false;
}, true);
app.addEventListener('pointerup', e => {
  const want = pressedSig;
  pressedSig = null;
  if (!want) return;
  const x = e.clientX, y = e.clientY;
  setTimeout(() => {
    if (clickSeen) return;
    const t = document.elementFromPoint(x, y)?.closest('[data-act]');
    if (t && app.contains(t) && actSig(t) === want) dispatch(t);
  }, 0);
}, true);

app.addEventListener('click', e => {
  clickSeen = true;
  const t = e.target.closest('[data-act]');
  if (!t || !app.contains(t)) return;
  e.stopPropagation();
  dispatch(t);
});

// clavier : Entrée / Espace sur un élément cliquable non natif
app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target;
  if (t?.getAttribute?.('role') === 'button' && t.dataset.act) { e.preventDefault(); t.click(); }
});

app.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-hover]');
  if (!t) return;
  set({ [t.dataset.hover]: Number(t.dataset.hval) });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.modal && !document.querySelector('.pk-overlay')) { formEpoch++; set({ modal:false, editing:null }); }
});

// retour sur l'onglet : cours rafraîchis (sans forcer si récents)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.user && snap) window.PatrimoineData.refreshPerf(true, false).catch(() => {});
});

render();
UI.whenReady(app, boot);
</script>
</body>
</html>
